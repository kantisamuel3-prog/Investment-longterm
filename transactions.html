<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#101827">

  <title>Novarise - Transaction History</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      padding: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f3f7ff 0%,
          #eef4ff 100%
        );

      color: #14213d;

      overflow-x: hidden;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      width: 100%;
      max-width: 100%;
      min-width: 0;

      background:
        linear-gradient(
          135deg,
          #101827,
          #172554
        );

      color: white;

      padding: 16px 5%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,0.15);
    }


    .logo {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 9px;

      font-size: 22px;
      font-weight: bold;

      white-space: nowrap;
    }


    .logo-icon {
      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #60a5fa
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 21px;
    }


    .header-buttons {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 8px;

      flex-shrink: 0;
    }


    button {
      border: 0;

      padding: 10px 15px;

      border-radius: 9px;

      cursor: pointer;

      font-weight: bold;

      font-size: 14px;

      white-space: nowrap;

      transition:
        transform .2s ease,
        background .2s ease;
    }


    button:hover {
      transform: translateY(-1px);
    }


    #homeButton {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #3b82f6
        );

      color: white;
    }


    #homeButton:hover {
      background:
        linear-gradient(
          135deg,
          #1d4ed8,
          #2563eb
        );
    }


    #logoutButton {
      background: #ef4444;
      color: white;
    }


    #logoutButton:hover {
      background: #dc2626;
    }


    /* =========================
       MAIN
       ========================= */

    main {
      width: 100%;
      max-width: 950px;

      margin:
        32px auto;

      padding:
        0 20px;
    }


    .page-title {
      width: 100%;

      margin-bottom: 22px;
    }


    .page-title h2 {
      margin:
        0 0 8px;

      font-size: 32px;

      line-height: 1.2;

      color: #14213d;
    }


    #userEmail {
      color: #64748b;

      font-size: 15px;

      overflow-wrap: anywhere;
    }


    /* =========================
       CARD
       ========================= */

    .card {
      width: 100%;
      min-width: 0;

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );

      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 8px 30px
        rgba(
          37,
          99,
          235,
          0.08
        );

      border:
        1px solid
        rgba(
          148,
          163,
          184,
          0.18
        );
    }


    .card-header {
      width: 100%;
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 14px;

      margin-bottom: 20px;
    }


    .transaction-icon {
      width: 55px;
      height: 55px;

      flex: 0 0 55px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #6366f1
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 26px;

      box-shadow:
        0 7px 18px
        rgba(
          37,
          99,
          235,
          0.22
        );
    }


    .card-header > div:last-child {
      min-width: 0;
    }


    .card-header h3 {
      margin:
        0 0 5px;

      font-size: 21px;

      line-height: 1.25;
    }


    .card-header p {
      margin: 0;

      color: #64748b;

      font-size: 14px;

      line-height: 1.45;
    }


    /* =========================
       TRANSACTIONS
       ========================= */

    #transactions {
      width: 100%;
      min-width: 0;
    }


    .transaction {
      width: 100%;
      min-width: 0;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      padding:
        17px 0;

      border-bottom:
        1px solid #e5e7eb;
    }


    .transaction:last-child {
      border-bottom: 0;
    }


    .transaction-left {
      min-width: 0;

      flex: 1 1 auto;

      display: flex;

      align-items: center;

      gap: 12px;
    }


    .transaction-type-icon {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }


    .deposit-icon {
      background: #dcfce7;
      color: #16a34a;
    }


    .withdraw-icon {
      background: #fef3c7;
      color: #d97706;
    }


    .investment-icon {
      background: #dbeafe;
      color: #2563eb;
    }


    .transaction-info {
      min-width: 0;

      flex: 1 1 auto;
    }


    .transaction-info strong {
      display: block;

      font-size: 16px;

      margin-bottom: 5px;

      line-height: 1.25;

      overflow-wrap: anywhere;
    }


    .transaction-date {
      color: #64748b;

      font-size: 13px;

      line-height: 1.35;

      overflow-wrap: anywhere;
    }


    .transaction-amount {
      flex: 0 0 auto;

      font-size: 17px;

      font-weight: bold;

      white-space: nowrap;

      text-align: right;
    }


    .deposit-amount {
      color: #16a34a;
    }


    .withdraw-amount {
      color: #dc2626;
    }


    .investment-amount {
      color: #2563eb;
    }


    /* =========================
       MESSAGE
       ========================= */

    .message {
      width: 100%;

      text-align: center;

      padding:
        45px 20px;

      color: #64748b;
    }


    .message-icon {
      font-size: 45px;

      margin-bottom: 12px;
    }


    .message h3 {
      margin:
        0 0 8px;

      color: #334155;

      font-size: 19px;
    }


    .message p {
      margin: 0;

      line-height: 1.5;

      font-size: 14px;
    }


    /* =========================
       TABLET / MOBILE
       ========================= */

    @media (max-width: 600px) {

      header {
        padding:
          13px 12px;

        gap: 8px;
      }


      .logo {
        font-size: 18px;

        gap: 7px;

        flex: 1 1 auto;

        min-width: 0;
      }


      .logo-icon {
        width: 34px;
        height: 34px;

        flex-basis: 34px;

        border-radius: 10px;

        font-size: 18px;
      }


      .header-buttons {
        gap: 5px;
      }


      .header-buttons button {
        padding:
          9px 9px;

        font-size: 11px;
      }


      main {
        width: 100%;

        margin:
          23px auto;

        padding:
          0 12px;
      }


      .page-title {
        margin-bottom: 18px;
      }


      .page-title h2 {
        font-size: 26px;
      }


      #userEmail {
        font-size: 13px;
      }


      .card {
        padding:
          18px;

        border-radius: 17px;
      }


      .card-header {
        gap: 10px;

        margin-bottom: 14px;

        align-items: flex-start;
      }


      .transaction-icon {
        width: 47px;
        height: 47px;

        flex-basis: 47px;

        border-radius: 13px;

        font-size: 22px;
      }


      .card-header h3 {
        font-size: 17px;
      }


      .card-header p {
        font-size: 12px;
      }


      .transaction {
        gap: 8px;

        padding:
          15px 0;
      }


      .transaction-left {
        gap: 9px;
      }


      .transaction-type-icon {
        width: 40px;
        height: 40px;

        flex-basis: 40px;

        border-radius: 11px;

        font-size: 17px;
      }


      .transaction-info strong {
        font-size: 14px;

        margin-bottom: 4px;
      }


      .transaction-date {
        font-size: 11px;
      }


      .transaction-amount {
        font-size: 13px;
      }


      .message {
        padding:
          32px 8px;
      }


      .message-icon {
        font-size: 40px;
      }


      .message h3 {
        font-size: 17px;
      }


      .message p {
        font-size: 13px;
      }

    }


    /* =========================
       SMALL PHONES
       ========================= */

    @media (max-width: 380px) {

      header {
        padding:
          11px 9px;
      }


      .logo {
        font-size: 16px;
      }


      .logo-icon {
        width: 31px;
        height: 31px;

        flex-basis: 31px;

        font-size: 16px;
      }


      .header-buttons {
        gap: 4px;
      }


      .header-buttons button {
        padding:
          8px 7px;

        font-size: 10px;
      }


      main {
        padding:
          0 9px;
      }


      .page-title h2 {
        font-size: 24px;
      }


      .card {
        padding:
          15px;
      }


      .card-header {
        gap: 8px;
      }


      .transaction-icon {
        width: 43px;
        height: 43px;

        flex-basis: 43px;

        font-size: 20px;
      }


      .card-header h3 {
        font-size: 16px;
      }


      .card-header p {
        font-size: 11px;
      }


      .transaction {
        gap: 5px;
      }


      .transaction-left {
        gap: 7px;
      }


      .transaction-type-icon {
        width: 37px;
        height: 37px;

        flex-basis: 37px;

        font-size: 16px;
      }


      .transaction-info strong {
        font-size: 13px;
      }


      .transaction-date {
        font-size: 10px;
      }


      .transaction-amount {
        font-size: 12px;
      }

    }


    /* =========================
       EXTRA SMALL PHONES
       ========================= */

    @media (max-width: 330px) {

      .logo {
        font-size: 14px;
      }


      .header-buttons button {
        padding:
          7px 6px;

        font-size: 9px;
      }


      main {
        padding:
          0 7px;
      }


      .card {
        padding:
          13px;
      }


      .transaction-amount {
        font-size: 11px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header>

    <div class="logo">

      <div class="logo-icon">
        📈
      </div>

      Novarise

    </div>


    <div class="header-buttons">

      <button id="homeButton">
        🏠 Home
      </button>


      <button id="logoutButton">
        Logout
      </button>

    </div>

  </header>



  <!-- =========================
       MAIN
       ========================= -->

  <main>


    <div class="page-title">

      <h2>
        Transaction History
      </h2>

      <div id="userEmail">
        Checking account...
      </div>

    </div>



    <div class="card">


      <div class="card-header">

        <div class="transaction-icon">
          📄
        </div>


        <div>

          <h3>
            Your Transactions
          </h3>

          <p>
            Your deposits, withdrawals,
            and investments.
          </p>

        </div>

      </div>



      <div id="transactions">

        <div class="message">

          <div class="message-icon">
            ⏳
          </div>

          <h3>
            Loading transactions...
          </h3>

          <p>
            Please wait.
          </p>

        </div>

      </div>


    </div>


  </main>



  <!-- =========================
       FIREBASE
       ========================= -->

  <script type="module">


    import {

      initializeApp

    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {

      getAuth,

      onAuthStateChanged,

      signOut

    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {

      getFirestore,

      doc,

      getDoc

    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



    /* =========================
       FIREBASE CONFIG
       ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",

      authDomain:
        "investpro-2dafb.firebaseapp.com",

      projectId:
        "investpro-2dafb",

      storageBucket:
        "investpro-2dafb.firebasestorage.app",

      messagingSenderId:
        "135092039764",

      appId:
        "1:135092039764:web:c4c71eef0c904346a77dc1"

    };



    /* =========================
       FIREBASE START
       ========================= */

    const app =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);



    /* =========================
       ELEMENTS
       ========================= */

    const emailElement =
      document.getElementById(
        "userEmail"
      );


    const transactionsElement =
      document.getElementById(
        "transactions"
      );


    const homeButton =
      document.getElementById(
        "homeButton"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );



    /* =========================
       MONEY FORMAT
       ========================= */

    function formatMoney(amount) {

      return "₱" +
        Number(
          amount || 0
        ).toLocaleString(
          "en-PH",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

    }



    /* =========================
       TRANSACTION TYPE
       ========================= */

    function getTransactionDetails(type) {


      if (type === "Deposit") {

        return {

          icon: "↓",

          iconClass:
            "deposit-icon",

          amountClass:
            "deposit-amount",

          sign: "+"

        };

      }


      if (type === "Withdraw") {

        return {

          icon: "↑",

          iconClass:
            "withdraw-icon",

          amountClass:
            "withdraw-amount",

          sign: "-"

        };

      }


      return {

        icon: "📈",

        iconClass:
          "investment-icon",

        amountClass:
          "investment-amount",

        sign: "-"

      };

    }



    /* =========================
       LOAD TRANSACTIONS
       ========================= */

    async function loadTransactions(user) {

      try {

        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const snapshot =
          await getDoc(
            userRef
          );


        if (!snapshot.exists()) {

          showEmpty();

          return;

        }


        const data =
          snapshot.data();


        const transactions =
          Array.isArray(
            data.transactions
          )
            ? data.transactions
            : [];


        if (
          transactions.length === 0
        ) {

          showEmpty();

          return;

        }


        transactionsElement.innerHTML =
          "";


        /*
          Newest transaction first
        */

        const sortedTransactions =
          [...transactions].reverse();


        sortedTransactions.forEach(
          transaction => {

            const type =
              transaction.type ||
              "Transaction";


            const amount =
              Number(
                transaction.amount || 0
              );


            const date =
              transaction.date ||
              "Date unavailable";


            const details =
              getTransactionDetails(
                type
              );


            /* =====================
               TRANSACTION CONTAINER
               ===================== */

            const transactionDiv =
              document.createElement(
                "div"
              );


            transactionDiv.className =
              "transaction";


            /* =====================
               LEFT SIDE
               ===================== */

            const left =
              document.createElement(
                "div"
              );


            left.className =
              "transaction-left";


            /* ICON */

            const icon =
              document.createElement(
                "div"
              );


            icon.className =
              "transaction-type-icon " +
              details.iconClass;


            icon.textContent =
              details.icon;


            /* INFO */

            const info =
              document.createElement(
                "div"
              );


            info.className =
              "transaction-info";


            const title =
              document.createElement(
                "strong"
              );


            title.textContent =
              type;


            const dateElement =
              document.createElement(
                "div"
              );


            dateElement.className =
              "transaction-date";


            dateElement.textContent =
              date;


            info.appendChild(
              title
            );


            info.appendChild(
              dateElement
            );


            left.appendChild(
              icon
            );


            left.appendChild(
              info
            );


            /* =====================
               RIGHT SIDE
               ===================== */

            const amountElement =
              document.createElement(
                "div"
              );


            amountElement.className =
              "transaction-amount " +
              details.amountClass;


            amountElement.textContent =
              details.sign +
              formatMoney(
                amount
              );


            /* =====================
               ADD TO PAGE
               ===================== */

            transactionDiv.appendChild(
              left
            );


            transactionDiv.appendChild(
              amountElement
            );


            transactionsElement.appendChild(
              transactionDiv
            );

          }
        );


      } catch (error) {

        console.error(
          "Transaction loading error:",
          error
        );


        transactionsElement.innerHTML = `

          <div class="message">

            <div class="message-icon">
              ⚠️
            </div>

            <h3>
              Unable to load account data
            </h3>

            <p>
              Please refresh the page
              and try again.
            </p>

          </div>

        `;

      }

    }



    /* =========================
       EMPTY TRANSACTIONS
       ========================= */

    function showEmpty() {

      transactionsElement.innerHTML = `

        <div class="message">

          <div class="message-icon">
            📭
          </div>

          <h3>
            No transactions yet
          </h3>

          <p>
            Your deposits, withdrawals,
            and investments will appear here.
          </p>

        </div>

      `;

    }



    /* =========================
       HOME
       ========================= */

    homeButton.addEventListener(
      "click",
      () => {

        window.location.href =
          "dashboard.html";

      }
    );



    /* =========================
       LOGOUT
       ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          await signOut(
            auth
          );


          window.location.href =
            "index.html";


        } catch (error) {

          console.error(
            "Logout error:",
            error
          );


          alert(
            "Logout failed. Please try again."
          );

        }

      }
    );



    /* =========================
       LOGIN CHECK
       ========================= */

    onAuthStateChanged(
      auth,
      async user => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        emailElement.textContent =
          user.email ||
          "Logged in";


        await loadTransactions(
          user
        );

      }
    );


  </script>


</body>

</html>
