<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#101827">

  <title>Novarise - Transaction History</title>

  <style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  min-width:0;
  overflow-x:hidden;
}

body{
  width:100%;
  min-width:0;
  min-height:100vh;
  margin:0;
  padding:0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at 8% 20%,
      rgba(37,99,235,.10),
      transparent 28%
    ),
    radial-gradient(
      circle at 92% 80%,
      rgba(34,197,94,.09),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #f4f8ff 0%,
      #edf5ff 50%,
      #f9fcff 100%
    );

  color:#14213d;
  overflow-x:hidden;
}


/* =========================
   HEADER
   ========================= */

header{
  width:100%;
  min-width:0;
  min-height:88px;

  background:
    linear-gradient(
      110deg,
      #061538 0%,
      #0b2866 48%,
      #071a46 100%
    );

  color:white;

  padding:
    10px 5%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:18px;

  position:relative;
  overflow:hidden;

  border-bottom:
    1px solid
    rgba(96,165,250,.25);

  box-shadow:
    0 7px 25px
    rgba(10,35,90,.22);
}


/* blue/green light decoration */

header::before{
  content:"";

  position:absolute;

  width:48%;
  height:170px;

  right:-10%;
  top:-105px;

  background:
    linear-gradient(
      135deg,
      transparent 20%,
      rgba(37,99,235,.35),
      rgba(34,197,94,.28)
    );

  transform:skewX(-28deg);

  pointer-events:none;
}


header::after{
  content:"";

  position:absolute;

  width:45%;
  height:2px;

  right:8%;
  bottom:7px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #20b8ff,
      #55e85a,
      transparent
    );

  opacity:.8;

  pointer-events:none;
}


/* =========================
   NOVARISE LOGO
   ========================= */

.logo{
  min-width:0;

  display:flex;
  align-items:center;

  gap:11px;

  font-size:24px;
  font-weight:bold;

  white-space:nowrap;

  position:relative;
  z-index:2;
}


.logo-icon{
  width:58px;
  height:58px;

  flex:0 0 58px;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      #0b7cff,
      #1539c9
    );

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  box-shadow:
    0 0 0 2px
    rgba(96,165,250,.25),

    0 8px 22px
    rgba(0,132,255,.30);
}


/*
  Kung gagamit ka ng actual Novarise logo
  image, pangalanan ito:

  novarise-logo.png
*/

.logo-icon img{
  width:100%;
  height:100%;

  object-fit:contain;

  padding:2px;

  display:block;

  mix-blend-mode:screen;
}


/* =========================
   HEADER BUTTONS
   ========================= */

.header-buttons{
  min-width:0;

  display:flex;
  align-items:center;

  gap:10px;

  flex-shrink:0;

  position:relative;
  z-index:3;
}


button{
  border:0;

  padding:
    11px 17px;

  border-radius:12px;

  cursor:pointer;

  font-weight:bold;

  font-size:14px;

  white-space:nowrap;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}


button:hover{
  transform:
    translateY(-2px);
}


/* HOME */

#homeButton{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #0ea5e9
    );

  color:white;

  box-shadow:
    0 6px 18px
    rgba(37,99,235,.28);
}

.home-svg{
  width:19px;
  height:19px;
  flex:0 0 19px;
  stroke:currentColor;
  transition:
    transform .2s ease;
}

#homeButton:hover .home-svg{
  transform:translateY(-1px);
}

/* =========================
   MAIN
   ========================= */

main{
  width:100%;
  max-width:1080px;

  margin:
    34px auto;

  padding:
    0 20px;
}


/* =========================
   PAGE TITLE
   ========================= */

.page-title{
  width:100%;

  margin-bottom:22px;

  position:relative;
}


.page-title::after{
  content:"";

  display:block;

  width:150px;
  height:3px;

  margin-top:12px;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      #20b8ff,
      #55e85a
    );

  opacity:.75;
}


.page-title h2{
  margin:
    0 0 7px;

  font-size:35px;

  line-height:1.15;

  letter-spacing:-.7px;

  background:
    linear-gradient(
      90deg,
      #102a63,
      #1677e8
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}


#userEmail{
  color:#64748b;

  font-size:15px;

  overflow-wrap:anywhere;
}


/* =========================
   MAIN CARD
   ========================= */

.card{
  width:100%;
  min-width:0;

  background:
    rgba(
      255,
      255,
      255,
      .95
    );

  border-radius:26px;

  padding:28px;

  position:relative;

  overflow:hidden;

  border:
    1px solid
    rgba(96,165,250,.22);

  box-shadow:
    0 18px 50px
    rgba(30,82,170,.12);
}


/* top green-blue line */

.card::before{
  content:"";

  position:absolute;

  left:0;
  right:0;
  top:0;

  height:5px;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      #12bdf2,
      #4ade80
    );
}


/* =========================
   YOUR TRANSACTIONS HEADER
   ========================= */

.card-header{
  width:100%;
  min-width:0;

  display:flex;
  align-items:center;

  gap:15px;

  margin-bottom:20px;

  padding:
    14px 16px;

  border-radius:19px;

  background:
    linear-gradient(
      110deg,
      #071d52 0%,
      #0d3f91 62%,
      #0b58a9 100%
    );

  color:white;

  box-shadow:
    0 10px 25px
    rgba(10,52,130,.18);

  position:relative;

  overflow:hidden;
}


.card-header::after{
  content:"";

  position:absolute;

  right:-30px;
  bottom:-45px;

  width:200px;
  height:125px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      rgba(37,211,102,.65),
      rgba(37,99,235,.05)
    );

  transform:rotate(-12deg);
}


/* transaction icon */

.transaction-icon{
  width:59px;
  height:59px;

  flex:0 0 59px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #13bdf2,
      #2563eb 58%,
      #4ade80
    );

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;

  box-shadow:
    0 7px 20px
    rgba(0,180,255,.30);

  position:relative;

  z-index:2;
}


.transaction-icon::after{
  content:"";

  position:absolute;

  inset:4px;

  border-radius:14px;

  border:
    1px solid
    rgba(255,255,255,.35);
}


.card-header > div:last-child{
  min-width:0;

  position:relative;

  z-index:2;
}


.card-header h3{
  margin:
    0 0 4px;

  font-size:22px;

  line-height:1.25;

  color:white;
}


.card-header p{
  margin:0;

  color:
    rgba(
      255,
      255,
      255,
      .80
    );

  font-size:14px;

  line-height:1.45;
}


/* =========================
   TRANSACTIONS
   ========================= */

#transactions{
  width:100%;
  min-width:0;
}


.transaction{
  width:100%;
  min-width:0;

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:15px;

  padding:
    16px;

  margin-top:11px;

  border:
    1px solid
    rgba(148,163,184,.18);

  border-radius:18px;

  background:
    linear-gradient(
      100deg,
      rgba(255,255,255,.98),
      rgba(247,251,255,.96)
    );

  box-shadow:
    0 6px 18px
    rgba(37,99,235,.055);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}


.transaction:hover{
  transform:
    translateY(-2px);

  border-color:
    rgba(37,99,235,.22);

  box-shadow:
    0 10px 24px
    rgba(37,99,235,.10);
}


.transaction:last-child{
  border-bottom:
    1px solid
    rgba(148,163,184,.18);
}


.transaction-left{
  min-width:0;

  flex:1 1 auto;

  display:flex;

  align-items:center;

  gap:12px;
}


.transaction-type-icon{
  width:49px;
  height:49px;

  flex:0 0 49px;

  border-radius:15px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:21px;

  box-shadow:
    inset 0 0 0 1px
    rgba(255,255,255,.5);
}


/* DEPOSIT */

.deposit-icon{
  background:
    linear-gradient(
      145deg,
      #dcfce7,
      #bbf7d0
    );

  color:#16a34a;

  box-shadow:
    0 5px 14px
    rgba(22,163,74,.12);
}


/* WITHDRAW */

.withdraw-icon{
  background:
    linear-gradient(
      145deg,
      #fff7cf,
      #fde68a
    );

  color:#d97706;

  box-shadow:
    0 5px 14px
    rgba(217,119,6,.12);
}


/* INVESTMENT */

.investment-icon{
  background:
    linear-gradient(
      145deg,
      #dbeafe,
      #bfdbfe
    );

  color:#2563eb;

  box-shadow:
    0 5px 14px
    rgba(37,99,235,.12);
}


.transaction-info{
  min-width:0;

  flex:1 1 auto;
}


.transaction-info strong{
  display:block;

  font-size:16px;

  margin-bottom:5px;

  line-height:1.25;

  overflow-wrap:anywhere;

  color:#102a63;
}


.transaction-date{
  color:#64748b;

  font-size:13px;

  line-height:1.35;

  overflow-wrap:anywhere;
}


.transaction-amount{
  flex:0 0 auto;

  font-size:17px;

  font-weight:bold;

  white-space:nowrap;

  text-align:right;
}


.deposit-amount{
  color:#16a34a;
}


.withdraw-amount{
  color:#dc2626;
}


.investment-amount{
  color:#2563eb;
}

/* =====================================================
   REWARD CODE
   ORANGE / RED GIFT
===================================================== */

.reward-code-icon{

  background:
    linear-gradient(
      145deg,
      #fff1eb,
      #ffd9cc
    );

  color:#f04422;

  box-shadow:
    0 6px 16px
    rgba(240,68,34,.16);

}

.reward-code-icon svg{

  width:28px;
  height:28px;

  display:block;

}


/* =====================================================
   REWARD TODAY
   GREEN CALENDAR + STAR
===================================================== */

.reward-today-icon{

  background:
    linear-gradient(
      145deg,
      #dcfce7,
      #bbf7d0
    );

  color:#10b981;

  box-shadow:
    0 6px 16px
    rgba(16,185,129,.16);

}

.reward-today-icon svg{

  width:27px;
  height:27px;

  display:block;

}


/* =====================================================
   REWARD AMOUNT
===================================================== */

.reward-amount{

  color:#16a34a;

}


/* =====================================================
   REWARD DESCRIPTION
===================================================== */

.transaction-description{

  margin-top:4px;

  color:#7890a3;

  font-size:12px;

  line-height:1.3;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .reward-code-icon svg,
  .reward-today-icon svg{

    width:23px;
    height:23px;

  }

  .transaction-description{

    font-size:10px;

    margin-top:3px;

  }

}
    
/* =========================
   STATUS
   ========================= */

.transaction-right{
  flex:0 0 auto;

  display:flex;

  flex-direction:column;

  align-items:flex-end;

  gap:6px;
}


.status{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:
    5px 10px;

  border-radius:999px;

  font-size:10px;

  font-weight:bold;

  letter-spacing:.35px;

  white-space:nowrap;

  border:
    1px solid
    transparent;
}


.status-pending{
  background:#fff7d6;
  color:#b45309;
  border-color:#fde68a;
}


.status-approved{
  background:#dcfce7;
  color:#15803d;
  border-color:#86efac;

  box-shadow:
    0 3px 10px
    rgba(34,197,94,.10);
}


.status-rejected{
  background:#fee2e2;
  color:#dc2626;
  border-color:#fecaca;

  box-shadow:
    0 3px 10px
    rgba(239,68,68,.08);
}


/* =========================
   MESSAGE
   ========================= */

.message{
  width:100%;

  text-align:center;

  padding:
    45px 20px;

  color:#64748b;
}


.message-icon{
  font-size:45px;

  margin-bottom:12px;
}


.message h3{
  margin:
    0 0 8px;

  color:#334155;

  font-size:19px;
}


.message p{
  margin:0;

  line-height:1.5;

  font-size:14px;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width:600px){

  header{
    min-height:68px;

    padding:
      8px 12px;

    gap:8px;
  }


  .logo{
    font-size:18px;

    gap:7px;

    flex:1 1 auto;

    min-width:0;
  }


  .logo-icon{
    width:42px;
    height:42px;

    flex-basis:42px;

    border-radius:12px;
  }


  .header-buttons{
    gap:5px;
  }


  .header-buttons button{
    padding:
      9px 9px;

    font-size:11px;
  }


  main{
    width:100%;

    margin:
      23px auto;

    padding:
      0 12px;
  }


  .page-title{
    margin-bottom:18px;
  }


  .page-title h2{
    font-size:27px;
  }


  .page-title::after{
    width:100px;
  }


  #userEmail{
    font-size:13px;
  }


  .card{
    padding:17px;

    border-radius:19px;
  }


  .card-header{
    gap:10px;

    margin-bottom:13px;

    padding:12px;

    border-radius:15px;
  }


  .transaction-icon{
    width:45px;
    height:45px;

    flex-basis:45px;

    border-radius:13px;

    font-size:21px;
  }


  .card-header h3{
    font-size:17px;
  }


  .card-header p{
    font-size:11px;
  }


  .transaction{
    gap:8px;

    padding:
      13px 10px;

    margin-top:9px;

    border-radius:15px;
  }


  .transaction-left{
    gap:9px;
  }


  .transaction-type-icon{
    width:39px;
    height:39px;

    flex-basis:39px;

    border-radius:11px;

    font-size:17px;
  }


  .transaction-info strong{
    font-size:14px;

    margin-bottom:4px;
  }


  .transaction-date{
    font-size:11px;
  }


  .transaction-amount{
    font-size:13px;
  }


  .status{
    font-size:9px;

    padding:
      4px 7px;
  }

}


@media (max-width:380px){

  header{
    padding:
      7px 9px;
  }


  .logo{
    font-size:16px;
  }


  .logo-icon{
    width:37px;
    height:37px;

    flex-basis:37px;

    border-radius:11px;
  }


  .header-buttons{
    gap:4px;
  }


  .header-buttons button{
    padding:
      8px 7px;

    font-size:10px;
  }


  main{
    padding:
      0 9px;
  }


  .page-title h2{
    font-size:24px;
  }


  .card{
    padding:14px;
  }


  .card-header{
    gap:8px;
  }


  .transaction-icon{
    width:41px;
    height:41px;

    flex-basis:41px;

    font-size:19px;
  }


  .card-header h3{
    font-size:16px;
  }


  .card-header p{
    font-size:10px;
  }


  .transaction{
    gap:5px;

    padding:
      12px 8px;
  }


  .transaction-left{
    gap:7px;
  }


  .transaction-type-icon{
    width:36px;
    height:36px;

    flex-basis:36px;

    font-size:16px;
  }


  .transaction-info strong{
    font-size:13px;
  }


  .transaction-date{
    font-size:10px;
  }


  .transaction-amount{
    font-size:12px;
  }


  .status{
    font-size:8px;

    padding:
      3px 6px;
  }

}


@media (max-width:330px){

  .logo{
    font-size:14px;
  }


  .logo-icon{
    width:34px;
    height:34px;

    flex-basis:34px;
  }


  .header-buttons button{
    padding:
      7px 6px;

    font-size:9px;
  }


  main{
    padding:
      0 7px;
  }


  .card{
    padding:12px;
  }


  .transaction-amount{
    font-size:11px;
  }

}

</style>
</head>

  if (!firebase.apps.length) {

  /* =========================

  /* =========================
     MONEY FORMAT
     ========================= */

  function formatMoney(amount) {

    return "₱" +
      Number(amount || 0).toLocaleString(
        "en-PH",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

  }

    /* =========================
     PHILIPPINE DATE / TIME
     ========================= */

  function formatPhilippineDate(value) {

    if (!value) {
      return "Date unavailable";
    }

    let dateValue = null;


    /* FIREBASE TIMESTAMP */

    if (
      value &&
      typeof value.toDate === "function"
    ) {

      dateValue =
        value.toDate();

    }


    /* FIRESTORE TIMESTAMP */

    else if (
      value &&
      value.seconds !== undefined
    ) {

      const seconds =
        Number(value.seconds);

      if (Number.isFinite(seconds)) {

        dateValue =
          new Date(seconds * 1000);

      }

    }


    /* SERIALIZED FIRESTORE TIMESTAMP */

    else if (
      value &&
      value._seconds !== undefined
    ) {

      const seconds =
        Number(value._seconds);

      if (Number.isFinite(seconds)) {

        dateValue =
          new Date(seconds * 1000);

      }

    }


    /* JAVASCRIPT DATE */

    else if (
      value instanceof Date
    ) {

      dateValue = value;

    }


    /* NUMBER TIMESTAMP */

    else if (
      typeof value === "number"
    ) {

      dateValue =
        new Date(value);

    }


    /* STRING DATE */

    else if (
      typeof value === "string"
    ) {

      const parsed =
        new Date(value);

      if (
        !Number.isNaN(
          parsed.getTime()
        )
      ) {

        dateValue = parsed;

      }

    }


    /* INVALID DATE */

    if (
      !dateValue ||
      Number.isNaN(
        dateValue.getTime()
      )
    ) {

      return "Date unavailable";

    }


    /* PHILIPPINE DATE + TIME */

    return dateValue.toLocaleString(
      "en-PH",
      {
        timeZone: "Asia/Manila",

        day: "2-digit",
        month: "2-digit",
        year: "numeric",

        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",

        hour12: true
      }
    );

  }

  /* =========================
     TRANSACTION TYPE
     ========================= */

  function getTransactionDetails(type) {

  if (type === "Deposit") {

    return {

      icon: "↓",

      iconClass: "deposit-icon",

      amountClass: "deposit-amount",

      sign: "+",

      description: ""

    };

  }


  if (
    type === "Withdraw" ||
    type === "Withdrawal Request"
  ) {

    return {

      icon: "↑",

      iconClass: "withdraw-icon",

      amountClass: "withdraw-amount",

      sign: "-",

      description: ""

    };

  }


  if (type === "Recharge") {

    return {

      icon: "↓",

      iconClass: "deposit-icon",

      amountClass: "deposit-amount",

      sign: "+",

      description: ""

    };

  }


  /* =========================
     REWARD CODE
  ========================= */

  if (type === "Reward Code") {

    return {

      icon: `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M3 8.5A1.5 1.5 0 0 1 4.5 7H19.5A1.5 1.5 0 0 1 21 8.5v2A1.5 1.5 0 0 1 19.5 12H4.5A1.5 1.5 0 0 1 3 10.5v-2Z"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M12 7v15"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M12 7H8.7A2.7 2.7 0 1 1 11.4 4.3L12 7Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

          <path
            d="M12 7h3.3A2.7 2.7 0 1 0 12.6 4.3L12 7Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      `,

      iconClass: "reward-code-icon",

      amountClass: "reward-amount",

      sign: "+",

      description: "Reward from code"

    };

  }


  /* =========================
     REWARD TODAY
  ========================= */

  if (type === "Reward Today") {

    return {

      icon: `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="5"
            width="16"
            height="15"
            rx="2.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M8 3v4M16 3v4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M4 9h16"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="m12 11.2.8 1.7 1.9.2-1.4 1.3.4 1.9-1.7-.9-1.7.9.4-1.9-1.4-1.3 1.9-.2.8-1.7Z"
            fill="currentColor"
          />
        </svg>
      `,

      iconClass: "reward-today-icon",

      amountClass: "reward-amount",

      sign: "+",

      description: "Daily reward"

    };

  }


  /* =========================
     INVESTMENT / DEFAULT
  ========================= */

  return {

    icon: "📈",

    iconClass: "investment-icon",

    amountClass: "investment-amount",

    sign: "-",

    description: ""

  };

}
  

  /* =========================
     COMMISSION RECEIVED
     ========================= */

  if (type === "Commission Received") {

    return {

      icon: "✓",

      iconClass: "deposit-icon",

      amountClass: "deposit-amount",

      sign: "+",

      description: "Referral commission"

    };

  }


  if (type === "Deposit") {

    return {

      icon: "↓",

      iconClass: "deposit-icon",

      amountClass: "deposit-amount",

      sign: "+"

    };

  }


  if (
    type === "Withdraw" ||
    type === "Withdrawal Request"
  ) {

    return {

      icon: "↑",

      iconClass: "withdraw-icon",

      amountClass: "withdraw-amount",

      sign: "-"

    };

  }


  if (type === "Recharge") {

    return {

      icon: "↓",

      iconClass: "deposit-icon",

      amountClass: "deposit-amount",

      sign: "+"

    };

  }


  return {

    icon: "📈",

    iconClass: "investment-icon",

    amountClass: "investment-amount",

    sign: "-"

  };

}


  /* =========================
     LOAD TRANSACTIONS
     ========================= */

  async function loadTransactions(user) {

    try {

      const userRef =
        db.collection("Users").doc(user.uid);


      const snapshot =
        await userRef.get();


      if (!snapshot.exists) {

        showEmpty();

        return;

      }


      const data =
        snapshot.data();


      const transactions =
        Array.isArray(data.transactions)
          ? data.transactions
          : [];


      if (transactions.length === 0) {

        showEmpty();

        return;

      }


      transactionsElement.innerHTML = "";


      const sortedTransactions =
        [...transactions].reverse();


      sortedTransactions.forEach(
        transaction => {

          const type =
            transaction.type ||
            "Transaction";


          const amount =
            Number(
              transaction.amount || 0
            );


          const date =
            formatPhilippineDate(
              transaction.date
            );


          const details =
            getTransactionDetails(type);


          const transactionDiv =
            document.createElement("div");

          transactionDiv.className =
            "transaction";


          /* LEFT */

          const left =
            document.createElement("div");

          left.className =
            "transaction-left";


          const icon =
            document.createElement("div");

          icon.className =
            "transaction-type-icon " +
            details.iconClass;

          icon.innerHTML =
            details.icon;


          const info =
            document.createElement("div");

          info.className =
            "transaction-info";


          const title =
            document.createElement("strong");


          if (
            type === "Withdrawal Request"
          ) {

            title.textContent =
              "Withdrawal";

          } else {

            title.textContent =
              type;

          }


          const dateElement =
  document.createElement("div");

dateElement.className =
  "transaction-date";

dateElement.textContent =
  date;


info.appendChild(title);
info.appendChild(dateElement);
          
if(details.description){

  const descriptionElement =
    document.createElement("div");

  descriptionElement.className =
    "transaction-description";

  descriptionElement.textContent =
    details.description;

  info.appendChild(
    descriptionElement
  );
}

/* REWARD DESCRIPTION */

if(details.description){

  const descriptionElement =
    document.createElement("div");

  descriptionElement.className =
    "transaction-description";

  descriptionElement.textContent =
    details.description;

  info.appendChild(
    descriptionElement
  );

}

          left.appendChild(icon);
          left.appendChild(info);


          /* RIGHT */

          const right =
            document.createElement("div");

          right.className =
            "transaction-right";


          const amountElement =
            document.createElement("div");

          amountElement.className =
            "transaction-amount " +
            details.amountClass;

          amountElement.textContent =
            details.sign +
            formatMoney(amount);

          right.appendChild(amountElement);


          /* WITHDRAWAL STATUS */

          if (
           type === "Withdrawal Request" ||
           type === "Recharge"
         ) {

            const status =
              String(
                transaction.status ||
                "PENDING"
              ).toUpperCase();


            const statusElement =
              document.createElement("div");

            statusElement.className =
              "status";


            if (status === "APPROVED") {

              statusElement.classList.add(
                "status-approved"
              );

              statusElement.textContent =
                "APPROVED";

            }

            else if (status === "REJECTED") {

              statusElement.classList.add(
                "status-rejected"
              );

              statusElement.textContent =
                "REJECTED";

            }

            else {

              statusElement.classList.add(
                "status-pending"
              );

              statusElement.textContent =
                "PENDING";

            }


            right.appendChild(
              statusElement
            );

          }


          transactionDiv.appendChild(left);
          transactionDiv.appendChild(right);

          transactionsElement.appendChild(
            transactionDiv
          );

        }
      );


    } catch (error) {

      console.error(
        "Transaction loading error:",
        error
      );


      transactionsElement.innerHTML = `

        <div class="message">

          <div class="message-icon">
            ⚠️
          </div>

          <h3>
            Unable to load account data
          </h3>

          <p>
            Please refresh the page
            and try again.
          </p>

        </div>

      `;

    }

  }


  /* =========================
     EMPTY
     ========================= */

  function showEmpty() {

    transactionsElement.innerHTML = `

      <div class="message">

        <div class="message-icon">
          📭
        </div>

        <h3>
          No transactions yet
        </h3>

        <p>
          Your deposits, withdrawals,
          and investments will appear here.
        </p>

      </div>

    `;

  }


  /* =========================
     HOME
     ========================= */

  homeButton.addEventListener(
    "click",
    () => {

      window.location.href =
        "dashboard.html";

    }
  );

  /* =========================
     AUTH RESTORE
     ========================= */

  auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
  )
  .then(() => {

    return new Promise(resolve => {

      let finished = false;


      const unsubscribe =
        auth.onAuthStateChanged(
          async user => {

            if (finished) {
              return;
            }


            if (user) {

              finished = true;

              unsubscribe();


              console.log(
                "TRANSACTION AUTH RESTORED:",
                user.email
              );


              emailElement.textContent =
                user.email ||
                "Logged in";


              try {

                /*
                  Force Firebase to refresh/
                  validate the saved session.
                */

                await user.getIdToken(true);

                console.log(
                  "TRANSACTION AUTH TOKEN READY"
                );


                await loadTransactions(
                  user
                );

              } catch (error) {

                console.error(
                  "AUTH TOKEN ERROR:",
                  error
                );


                transactionsElement.innerHTML = `

                  <div class="message">

                    <div class="message-icon">
                      ⚠️
                    </div>

                    <h3>
                      Unable to verify login
                    </h3>

                    <p>
                      Please refresh the page.
                    </p>

                  </div>

                `;

              }


              resolve();

            }

          }
        );


      /*
        Give Firebase enough time to
        restore the saved local session.
      */

      setTimeout(() => {

        if (finished) {
          return;
        }


        finished = true;

        unsubscribe();


        const currentUser =
          auth.currentUser;


        if (currentUser) {

          console.log(
            "TRANSACTION AUTH FOUND:",
            currentUser.email
          );


          emailElement.textContent =
            currentUser.email ||
            "Logged in";


          currentUser
            .getIdToken(true)
            .then(() => {

              return loadTransactions(
                currentUser
              );

            })
            .catch(error => {

              console.error(
                "AUTH TOKEN ERROR:",
                error
              );

            });


        } else {

          console.log(
            "TRANSACTION AUTH NOT FOUND"
          );


          /*
            IMPORTANT:
            Stay on transaction.html.
            Never redirect to login.html.
          */

          emailElement.textContent =
            "No active login session";


          transactionsElement.innerHTML = `

            <div class="message">

              <div class="message-icon">
                🔐
              </div>

              <h3>
                Please login first
              </h3>

              <p>
                Your transaction history
                will appear here after
                you are logged in.
              </p>

            </div>

          `;

        }

        resolve();

      }, 10000);

    });

  })
  .catch(error => {

    console.error(
      "Firebase Auth initialization error:",
      error
    );


    emailElement.textContent =
      "Unable to restore login";


    transactionsElement.innerHTML = `

      <div class="message">

        <div class="message-icon">
          ⚠️
        </div>

        <h3>
          Unable to restore login
        </h3>

        <p>
          Please refresh the page
          and try again.
        </p>

      </div>

    `;

  });

</script>
