<script type="module">

/* =====================================================

===================================================== */

const app =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(app);

const db =
  getFirestore(app);



/* =====================================================
   ELEMENTS
===================================================== */

const investmentList =
  document.getElementById(
    "investmentList"
  );

const activeCount =
  document.getElementById(
    "activeCount"
  );

const claimCount =
  document.getElementById(
    "claimCount"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );



/* =====================================================
   LOCAL INVESTMENT DATA
===================================================== */

let currentInvestments = [];

let countdownTimer = null;



/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(amount){

  return "₱" +

    Number(
      amount || 0
    ).toLocaleString(
      "en-PH",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}



/* =====================================================
   CONVERT FIRESTORE DATE
===================================================== */

function getDateValue(value){

  if(!value){

    return null;

  }


  if(
    typeof value.toMillis ===
    "function"
  ){

    return new Date(
      value.toMillis()
    );

  }


  if(
    value instanceof Date
  ){

    return value;

  }


  if(
    typeof value === "string"
  ){

    const parsed =
      new Date(value);

    if(
      !Number.isNaN(
        parsed.getTime()
      )
    ){

      return parsed;

    }

  }


  return null;

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

  if(!date){

    return "—";

  }

  return date.toLocaleString(
    "en-PH",
    {
      month:"short",
      day:"numeric",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}



/* =====================================================
   FORMAT COUNTDOWN
===================================================== */

function formatRemaining(ms){

  if(ms <= 0){

    return "Claim available";

  }

  const totalSeconds =
    Math.floor(
      ms / 1000
    );

  const days =
    Math.floor(
      totalSeconds /
      86400
    );

  const hours =
    Math.floor(
      (totalSeconds % 86400) /
      3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) /
      60
    );

  const seconds =
    totalSeconds % 60;


  if(days > 0){

    return (
      days +
      "d " +
      hours +
      "h " +
      minutes +
      "m"
    );

  }


  return (
    String(hours).padStart(2,"0") +
    ":" +
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0")
  );

}



/* =====================================================
   GET LAST CLAIM TIME
===================================================== */

function getLastClaimDate(
  investment,
  startDate
){

  const lastClaim =
    getDateValue(
      investment.lastClaimDate
    );

  if(lastClaim){

    return lastClaim;

  }


  return startDate;

}



/* =====================================================
   GET CLAIM INFORMATION
===================================================== */

function getClaimInfo(
  investment,
  now
){

  const startDate =
    getDateValue(
      investment.date
    );

  const cycleDays =
    Number(
      investment.cycleDays || 30
    );

  const claimedDays =
    Number(
      investment.incomeDaysCredited || 0
    );


  if(!startDate){

    return {

      valid:false,

      complete:false,

      ready:false,

      remaining:0,

      nextClaim:null,

      claimedDays:claimedDays,

      cycleDays:cycleDays

    };

  }


  if(
    claimedDays >=
    cycleDays
  ){

    return {

      valid:true,

      complete:true,

      ready:false,

      remaining:0,

      nextClaim:null,

      claimedDays:cycleDays,

      cycleDays:cycleDays

    };

  }


  const lastClaimDate =
    getLastClaimDate(
      investment,
      startDate
    );


  if(!lastClaimDate){

    return {

      valid:false,

      complete:false,

      ready:false,

      remaining:0,

      nextClaim:null,

      claimedDays:claimedDays,

      cycleDays:cycleDays

    };

  }


  const nextClaim =
    new Date(
      lastClaimDate.getTime() +
      24 * 60 * 60 * 1000
    );


  const remaining =
    nextClaim.getTime() -
    now;


  return {

    valid:true,

    complete:false,

    ready:
      remaining <= 0,

    remaining:
      Math.max(
        0,
        remaining
      ),

    nextClaim:nextClaim,

    claimedDays:claimedDays,

    cycleDays:cycleDays

  };

}



/* =====================================================
   LOAD INVESTMENTS
===================================================== */

async function loadInvestments(){

  if(!auth.currentUser){

    return;

  }


  investmentList.innerHTML =

    `<div class="loading">
      Loading your investments...
    </div>`;


  try{

    const userRef =
      doc(
        db,
        "Users",
        auth.currentUser.uid
      );


    const snapshot =
      await getDoc(
        userRef
      );


    if(!snapshot.exists()){

      currentInvestments = [];

      showEmptyState();

      return;

    }


    const data =
      snapshot.data();


    const transactions =
      Array.isArray(
        data.transactions
      )
        ? data.transactions
        : [];


    const investments =
      transactions.filter(
        transaction =>
          transaction.type ===
          "Investment"
      );


    currentInvestments =
      investments;


    if(
      investments.length === 0
    ){

      showEmptyState();

      return;

    }


    renderInvestments(
      investments
    );


    startCountdown();

  }catch(error){

    console.error(
      "Load investments error:",
      error
    );


    investmentList.innerHTML =

      `<div class="empty-state">

        <div class="empty-icon">
          !
        </div>

        <h3>
          Unable to load investments
        </h3>

        <p>
          Please refresh the page and try again.
        </p>

      </div>`;

  }

}



/* =====================================================
   EMPTY STATE
===================================================== */

function showEmptyState(){

  activeCount.textContent =
    "0";

  claimCount.textContent =
    "0";


  stopCountdown();


  investmentList.innerHTML =

    `<div class="empty-state">

      <div class="empty-icon">
        📊
      </div>

      <h3>
        No investments yet
      </h3>

      <p>
        Your purchased investment products
        will appear here.
      </p>

    </div>`;

}



/* =====================================================
   RENDER INVESTMENTS
===================================================== */

function renderInvestments(
  investments
){

  investmentList.innerHTML = "";

  let active = 0;

  let availableClaims = 0;

  const now =
    Date.now();


  investments.forEach(
    (
      investment,
      index
    ) => {

      const card =
        createInvestmentCard(
          investment,
          index,
          now
        );


      investmentList.appendChild(
        card
      );


      const info =
        getClaimInfo(
          investment,
          now
        );


      if(
        !info.complete
      ){

        active++;

      }


      if(
        info.ready
      ){

        availableClaims++;

      }

    }
  );


  activeCount.textContent =
    active;

  claimCount.textContent =
    availableClaims;

}



/* =====================================================
   CREATE INVESTMENT CARD
===================================================== */

function createInvestmentCard(
  investment,
  index,
  now
){

  const card =
    document.createElement(
      "article"
    );

  card.className =
    "investment-card";

  card.dataset.index =
    index;


  const startDate =
    getDateValue(
      investment.date
    );


  const daily =
    Number(
      investment.dailyReturn || 0
    );


  const amount =
    Number(
      investment.amount || 0
    );


  const cycleDays =
    Number(
      investment.cycleDays || 30
    );


  const claimedDays =
    Number(
      investment.incomeDaysCredited || 0
    );


  const totalIncome =
    Number(
      investment.totalIncome || 0
    );


  const info =
    getClaimInfo(
      investment,
      now
    );


  let statusText =
    "ACTIVE";

  let statusClass =
    "status-active";


  if(
    info.complete
  ){

    statusText =
      "COMPLETED";

    statusClass =
      "status-complete";

  }else if(
    info.ready
  ){

    statusText =
      "CLAIM READY";

    statusClass =
      "status-ready";

  }


  const progress =
    Math.min(
      100,
      (
        claimedDays /
        cycleDays
      ) * 100
    );


  let claimHTML = "";


  if(
    info.complete
  ){

    claimHTML =

      `<div class="claim-area">

        <div class="claim-message">
          This investment has completed its
          ${cycleDays}-day claim cycle.
        </div>

        <button
          class="claim-button claimed"
          disabled
        >
          ✓ CYCLE COMPLETED
        </button>

      </div>`;

  }else if(
    info.ready
  ){

    claimHTML =

      `<div class="claim-area">

        <div class="claim-message">
          Your 24-hour claim is ready.
          Claim your daily income to continue
          to the next cycle.
        </div>

        <button
          class="claim-button claim-ready"
          data-index="${index}"
        >
          CLAIM ${formatMoney(daily)}
        </button>

      </div>`;

  }else{

    claimHTML =

      `<div
        class="claim-area"
        data-claim-area="${index}"
      >

        <div class="claim-message">
          Next claim available in
          <strong
            class="countdown"
            data-index="${index}"
            data-next-claim="${
              info.nextClaim
                ? info.nextClaim.getTime()
                : 0
            }"
          >
            ${formatRemaining(
              info.remaining
            )}
          </strong>
        </div>

        <button
          class="claim-button"
          disabled
        >
          CLAIM NOT READY
        </button>

      </div>`;

  }


  card.innerHTML =

    `<div class="investment-top">

      <div>

        <h2 class="product-name">
          ${escapeHTML(
            investment.product ||
            "Investment"
          )}
        </h2>

        <div class="investment-number">
          Investment #${index + 1}
        </div>

      </div>

      <span
        class="status ${statusClass}"
        data-status="${index}"
      >
        ${statusText}
      </span>

    </div>


    <div class="info-grid">

      <div class="info-box">

        <span class="info-label">
          INVESTED
        </span>

        <span class="info-value">
          ${formatMoney(amount)}
        </span>

      </div>


      <div class="info-box">

        <span class="info-label">
          DAILY INCOME
        </span>

        <span class="info-value">
          ${formatMoney(daily)}
        </span>

      </div>


      <div class="info-box">

        <span class="info-label">
          STARTED
        </span>

        <span class="info-value">
          ${formatDate(startDate)}
        </span>

      </div>


      <div class="info-box">

        <span class="info-label">
          TOTAL CLAIMED
        </span>

        <span class="info-value">
          ${formatMoney(totalIncome)}
        </span>

      </div>

    </div>


    <div class="progress-area">

      <div class="progress-head">

        <span>
          Cycle Progress
        </span>

        <strong>
          ${Math.min(
            claimedDays,
            cycleDays
          )} / ${cycleDays}
        </strong>

      </div>

      <div class="progress-track">

        <div
          class="progress-bar"
          style="width:${progress}%"
        ></div>

      </div>

    </div>


    ${claimHTML}`;


  attachClaimButton(
    card
  );


  return card;

}



/* =====================================================
   ATTACH CLAIM BUTTON
===================================================== */

function attachClaimButton(
  card
){

  const claimButton =
    card.querySelector(
      ".claim-button.claim-ready"
    );


  if(!claimButton){

    return;

  }


  claimButton.addEventListener(
    "click",
    async () => {

      claimButton.disabled =
        true;

      claimButton.textContent =
        "CLAIMING...";


      await claimInvestment(
        Number(
          claimButton.dataset.index
        )
      );

    }
  );

}



/* =====================================================
   MAKE CLAIM READY
===================================================== */

function makeClaimReady(
  index
){

  const card =
    document.querySelector(
      `.investment-card[data-index="${index}"]`
    );


  if(!card){

    return;

  }


  const investment =
    currentInvestments[index];


  if(!investment){

    return;

  }


  const daily =
    Number(
      investment.dailyReturn || 0
    );


  const cycleDays =
    Number(
      investment.cycleDays || 30
    );


  const claimedDays =
    Number(
      investment.incomeDaysCredited || 0
    );


  if(
    claimedDays >=
    cycleDays
  ){

    return;

  }


  const status =
    card.querySelector(
      `[data-status="${index}"]`
    );


  if(status){

    status.textContent =
      "CLAIM READY";

    status.className =
      "status status-ready";

  }


  const claimArea =
    card.querySelector(
      `[data-claim-area="${index}"]`
    );


  if(!claimArea){

    return;

  }


  claimArea.innerHTML =

    `<div class="claim-message">
      Your 24-hour claim is ready.
      Claim your daily income to continue
      to the next cycle.
    </div>

    <button
      class="claim-button claim-ready"
      data-index="${index}"
    >
      CLAIM ${formatMoney(daily)}
    </button>`;


  attachClaimButton(
    card
  );


  updateClaimCount();

}



/* =====================================================
   UPDATE COUNTDOWN
===================================================== */

function updateCountdowns(){

  if(!auth.currentUser){

    return;

  }


  const now =
    Date.now();


  const countdowns =
    document.querySelectorAll(
      ".countdown"
    );


  countdowns.forEach(
    countdown => {

      const nextClaim =
        Number(
          countdown.dataset.nextClaim
        );


      const remaining =
        nextClaim -
        now;


      if(
        remaining <= 0
      ){

        const index =
          Number(
            countdown.dataset.index
          );


        makeClaimReady(
          index
        );

        return;

      }


      countdown.textContent =
        formatRemaining(
          remaining
        );

    }
  );

}



/* =====================================================
   START COUNTDOWN
===================================================== */

function startCountdown(){

  stopCountdown();


  countdownTimer =
    setInterval(
      updateCountdowns,
      1000
    );

}



/* =====================================================
   STOP COUNTDOWN
===================================================== */

function stopCountdown(){

  if(countdownTimer){

    clearInterval(
      countdownTimer
    );

    countdownTimer =
      null;

  }

}



/* =====================================================
   UPDATE AVAILABLE CLAIM COUNT
===================================================== */

function updateClaimCount(){

  let count = 0;


  currentInvestments.forEach(
    investment => {

      const info =
        getClaimInfo(
          investment,
          Date.now()
        );


      if(
        info.ready
      ){

        count++;

      }

    }
  );


  const readyButtons =
    document.querySelectorAll(
      ".claim-button.claim-ready"
    );


  /*
     Use visible ready cards as the
     immediate UI count.
  */

  if(
    readyButtons.length >
    count
  ){

    count =
      readyButtons.length;

  }


  claimCount.textContent =
    count;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
){

  return String(
    value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   CLAIM INVESTMENT
===================================================== */

async function claimInvestment(
  investmentIndex
){

  const user =
    auth.currentUser;


  if(!user){

    alert(
      "Please login first."
    );

    return;

  }


  try{

    const userRef =
      doc(
        db,
        "Users",
        user.uid
      );


    await runTransaction(
      db,
      async transaction => {

        const snapshot =
          await transaction.get(
            userRef
          );


        if(
          !snapshot.exists()
        ){

          throw new Error(
            "User account not found."
          );

        }


        const data =
          snapshot.data();


        const transactions =
          Array.isArray(
            data.transactions
          )
            ? data.transactions
            : [];


        const investmentIndexes =
          [];


        transactions.forEach(
          (
            transactionItem,
            transactionIndex
          ) => {

            if(
              transactionItem.type ===
              "Investment"
            ){

              investmentIndexes.push(
                transactionIndex
              );

            }

          }
        );


        const actualIndex =
          investmentIndexes[
            investmentIndex
          ];


        if(
          actualIndex === undefined
        ){

          throw new Error(
            "Investment not found."
          );

        }


        const investment =
          transactions[
            actualIndex
          ];


        const daily =
          Number(
            investment.dailyReturn || 0
          );


        const cycleDays =
          Number(
            investment.cycleDays || 30
          );


        const claimedDays =
          Number(
            investment.incomeDaysCredited || 0
          );


        if(
          !daily ||
          daily <= 0
        ){

          throw new Error(
            "Invalid daily income."
          );

        }


        if(
          claimedDays >=
          cycleDays
        ){

          throw new Error(
            "Investment cycle completed."
          );

        }


        const startDate =
          getDateValue(
            investment.date
          );


        if(!startDate){

          throw new Error(
            "Investment start date is invalid."
          );

        }


        const lastClaimDate =
          getLastClaimDate(
            investment,
            startDate
          );


        if(!lastClaimDate){

          throw new Error(
            "Investment claim date is invalid."
          );

        }


        const nextClaim =
          new Date(
            lastClaimDate.getTime() +
            24 * 60 * 60 * 1000
          );


        const now =
          new Date();


        if(
          now.getTime() <
          nextClaim.getTime()
        ){

          throw new Error(
            "Claim is not available yet."
          );

        }


        const oldBalance =
          Number(
            data.balance || 0
          );


        const newBalance =
          oldBalance +
          daily;


        const newClaimedDays =
          claimedDays +
          1;


        const oldTotalIncome =
          Number(
            investment.totalIncome || 0
          );


        transactions[
          actualIndex
        ] = {

          ...investment,

          incomeDaysCredited:
            newClaimedDays,

          totalIncome:
            oldTotalIncome +
            daily,

          lastClaimDate:
            Timestamp.fromDate(
              now
            )

        };


        transaction.set(

          userRef,

          {

            balance:
              newBalance,

            transactions:
              transactions

          },

          {

            merge:true

          }

        );

      }
    );


    alert(
      "Income claimed successfully."
    );


    await loadInvestments();


  }catch(error){

    console.error(
      "Claim income error:",
      error
    );


    if(
      error.message ===
      "Claim is not available yet."
    ){

      alert(
        "Your 24-hour claim is not ready yet."
      );

    }else if(
      error.message ===
      "Investment cycle completed."
    ){

      alert(
        "This investment has already completed its 30-day cycle."
      );

    }else if(
      error.message ===
      "Investment not found."
    ){

      alert(
        "Investment not found. Please refresh the page."
      );

    }else if(
      error.message ===
      "Invalid daily income."
    ){

      alert(
        "This investment has an invalid daily income."
      );

    }else{

      alert(
        "Unable to claim income. Please try again."
      );

    }


    await loadInvestments();

  }

}



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      stopCountdown();

      window.location.href =
        "login.html";

      return;

    }


    await loadInvestments();

  }
);



/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async () => {

    try{

      stopCountdown();


      await signOut(
        auth
      );


      window.location.href =
        "index.html";

    }catch(error){

      console.error(
        "Logout error:",
        error
      );


      alert(
        "Logout failed. Please try again."
      );

    }

  }
);
