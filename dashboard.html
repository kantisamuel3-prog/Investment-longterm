<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InvestPro Demo Dashboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f3f6fb;
  color: #172033;
}

.top {
  background: #111827;
  color: white;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logout {
  background: #ef4444;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
}

.welcome {
  background: linear-gradient(135deg, #173b8f, #2864e8);
  color: white;
  padding: 35px 22px;
}

.welcome h1 {
  font-size: 29px;
  margin-bottom: 8px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 25px 20px;
}

.section-title {
  margin-bottom: 18px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.card h3 {
  color: #2563eb;
  margin-bottom: 10px;
}

.amount {
  font-size: 27px;
  font-weight: bold;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 25px;
}

.action-btn {
  padding: 15px;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.deposit {
  background: #16a34a;
}

.withdraw {
  background: #dc2626;
}

.activity {
  margin-top: 30px;
}

.activity-item {
  background: white;
  padding: 17px;
  margin-top: 10px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.demo {
  margin-top: 30px;
  padding: 15px;
  background: #fff7ed;
  color: #9a3412;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
}
.products-section {
  margin-top: 35px;
}

.products {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.product-card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.product-card h3 {
  color: #2563eb;
  margin-bottom: 10px;
}

.product-price {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 10px;
}

.product-card p {
  color: #64748b;
  margin-bottom: 18px;
}

.product-card button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.product-card button:hover {
  opacity: .9;
}
@media (max-width: 700px) {
  .summary {
    grid-template-columns: 1fr;
  }

  .actions {
    grid-template-columns: 1fr;
  }
.products {
  grid-template-columns: 1fr;
}
  .activity-item {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="top">

  <div class="logo">
    InvestPro
  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>

<div class="welcome">

  <h1>
    Welcome, Members! 👋
  </h1>

  <p>
    Your demonstration investment dashboard
  </p>

</div>

<div class="container">

  <h2 class="section-title">
    Portfolio Summary
  </h2>

  <div class="summary">

    <div class="card">
      <h3>Balance</h3>
      <div class="amount" id="balance">₱0</div>
    </div>

    <div class="card">
      <h3>Total Investment</h3>
      <div class="amount" id="investment">₱0</div>
    </div>

    <div class="card">
      <h3>Profit</h3>
      <div class="amount">₱0</div>
    </div>

  </div>


  <div class="actions">

    <button
      class="action-btn deposit"
      onclick="deposit()">
      + Deposit
    </button>

    <button
      class="action-btn withdraw"
      onclick="withdraw()">
      - Withdraw
    </button>

  </div>


  <div class="activity">

    <h2 class="section-title">
      Transaction History
    </h2>

    <div id="transactions">

      <div class="activity-item">
        <span></span>
        <span></span>
      </div>

    </div>

  </div>


  <!-- PRODUCTS -->
<div class="products-section">

  <h2 class="section-title">
    Products
  </h2>

  <div class="products">

    <div class="product-card">
      <h3>Starter Plan</h3>
      <div class="product-price">₱100</div>
      <p>Demo product</p>
      <button onclick="buyProduct('Starter Plan', 100)">
        Buy Product
      </button>
    </div>

    <div class="product-card">
      <h3>Basic Plan</h3>
      <div class="product-price">₱500</div>
      <p>Demo product</p>
      <button onclick="buyProduct('Basic Plan', 500)">
        Buy Product
      </button>
    </div>

    <div class="product-card">
      <h3>Premium Plan</h3>
      <div class="product-price">₱1,000</div>
      <p>Demo product</p>
      <button onclick="buyProduct('Premium Plan', 1000)">
        Buy Product
      </button>
    </div>

  <div class="container">

<div class="products">

<div class="products-section">


<script>

let balance = 10000;

function formatMoney(amount) {

  return "₱" + amount.toLocaleString("en-PH", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

}


function updateBalance() {

  document.getElementById("balance").textContent =
    formatMoney(balance);

}


function addTransaction(type, amount) {

  const container =
    document.getElementById("transactions");

  const item =
    document.createElement("div");

  item.className = "activity-item";

  item.innerHTML =
    "<span>" + type + "</span>" +
    "<span>" + formatMoney(amount) + "</span>";

  container.prepend(item);

}


function deposit() {

  const input =
    prompt("Enter deposit amount:");

  const amount =
    Number(input);

  if (!Number.isFinite(amount) || amount <= 0) {

    alert("Please enter a valid amount.");

    return;
  }

  if (amount > 1000000) {

    alert("amount is too large.");

    return;
  }

  balance += amount;

  updateBalance();

  addTransaction(
    "Deposit",
    amount
  );

  alert(
    "deposit added: " +
    formatMoney(amount)
  );

}


function withdraw() {

  const input =
    prompt("Enter withdrawal amount:");

  const amount =
    Number(input);

  if (!Number.isFinite(amount) || amount <= 0) {

    alert("Please enter a valid amount.");

    return;
  }

  if (amount > balance) {

    alert(
      "withdrawal exceeds the demo balance."
    );

    return;
  }

  balance -= amount;

  updateBalance();

  addTransaction(
    "Withdrawal",
    -amount
  );

  alert(
    "Demo withdrawal recorded: " +
    formatMoney(amount)
  );

}


function logout() {

  window.location.href = "index.html";

}

</script>
