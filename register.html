<!DOCTYPE html>
<html>
<head>
  <title>Magparehistro</title>
  <!-- Idagdag ang Firebase SDK dito -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
</head>
<body>
  <h2>Mag-register</h2>
  <form id="registerForm">
    <input type="email" id="email" placeholder="Email" required /><br />
    <input type="password" id="password" placeholder="Password" required /><br />
    <button type="submit">Register</button>
  </form>

  <script>
    // Ilagay dito ang iyong Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Kapag sinubmit ang form
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Para di mag-reload ang page

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Gumamit ng Firebase Authentication para mag-register
      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          alert('Matagumpay na nakarehistro!');
          // Pwede mong ilagay dito ang redirect sa login page
        })
        .catch((error) => {
          alert(error.message);
        });
    });
  </script>
</body>
</html>
