<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Novarise - Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    /* LOGO */
    .logo {
      text-align: center;
      margin-bottom: 5px;
    }

    .logo img {
      width: 220px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #1e293b;
      font-size: 30px;
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #334155;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .input-group {
      margin-bottom: 17px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    input::placeholder {
      color: #94a3b8;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .register-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .register-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    /* MESSAGE */
    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* SUCCESS SCREEN */
    .success-screen {
      display: none;
      text-align: center;
    }

    .success-icon {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #dcfce7;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
    }

    .success-screen h2 {
      color: #166534;
      font-size: 25px;
      margin-bottom: 12px;
    }

    .success-screen p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .login-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    /* LOGIN LINK */
    .login {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 14px;
    }

    .login a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .login a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- REGISTER FORM -->
    <div id="registerSection">

      <div class="logo">
        <img
          src="novarise-logo.png.avif"
          alt="Novarise Logo"
        >
      </div>

      <h1>Create Account</h1>

      <div class="subtitle">
        Create your Novarise account
      </div>

      <form id="registerForm">

        <div class="input-group">
          <label for="phone">Phone Number</label>

          <input
            type="tel"
            id="phone"
            placeholder="09XXXXXXXXX"
            autocomplete="tel"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            minlength="6"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            autocomplete="new-password"
            required
          >
        </div>

        <button
          type="submit"
          id="registerButton"
          class="register-btn"
        >
          Create Account
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>


    <!-- SUCCESS SCREEN -->
    <div id="successScreen" class="success-screen">

      <div class="success-icon">
        ✓
      </div>

      <h2>Account Registered!</h2>

      <p>
        Your Novarise account has been
        created successfully.
      </p>

      <a
        href="login.html"
        class="login-btn"
      >
        Continue to Login
      </a>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
      authDomain: "investpro-2dafb.firebaseapp.com",
      projectId: "investpro-2dafb",
      storageBucket: "investpro-2dafb.firebasestorage.app",
      messagingSenderId: "135092039764",
      appId: "1:135092039764:web:c4c71eef0c904346a77dc1",
      measurementId: "G-0L77SFTC4F"
    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // NORMALIZE PHILIPPINE PHONE NUMBER
    // ==========================================

    function normalizePhone(phone) {

      phone = phone.trim();

      // Remove spaces, dashes and parentheses
      phone = phone.replace(/[\s\-()]/g, "");

      // 09171234567
      // becomes
      // 639171234567

      if (phone.startsWith("09")) {
        phone = "63" + phone.substring(1);
      }

      // +639171234567
      // becomes
      // 639171234567

      if (phone.startsWith("+63")) {
        phone = phone.substring(1);
      }

      return phone;
    }


    // ==========================================
    // PHONE → FIREBASE EMAIL
    // ==========================================

    function phoneToFirebaseEmail(phone) {

      const normalizedPhone =
        normalizePhone(phone);

      return normalizedPhone +
        "@novarise.local";
    }


    // ==========================================
    // SHOW ERROR MESSAGE
    // ==========================================

    function showError(message) {

      const messageBox =
        document.getElementById("message");

      messageBox.className =
        "message error";

      messageBox.textContent =
        message;
    }


    // ==========================================
    // REGISTER
    // ==========================================

    document
      .getElementById("registerForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const phone =
            document.getElementById("phone").value;

          const password =
            document.getElementById("password").value;

          const confirmPassword =
            document.getElementById("confirmPassword").value;

          const button =
            document.getElementById("registerButton");


          // ======================================
          // NORMALIZE PHONE
          // ======================================

          const normalizedPhone =
            normalizePhone(phone);


          // ======================================
          // VALIDATE PHONE
          // ======================================

          if (!/^639\d{9}$/.test(normalizedPhone)) {

            showError(
              "Please enter a valid Philippine phone number."
            );

            return;
          }


          // ======================================
          // VALIDATE PASSWORD
          // ======================================

          if (password.length < 6) {

            showError(
              "Password must be at least 6 characters."
            );

            return;
          }


          // ======================================
          // CONFIRM PASSWORD
          // ======================================

          if (password !== confirmPassword) {

            showError(
              "Passwords do not match."
            );

            return;
          }


          // ======================================
          // FIREBASE EMAIL
          // ======================================

          const firebaseEmail =
            phoneToFirebaseEmail(phone);


          // ======================================
          // DISABLE BUTTON
          // ======================================

          button.disabled = true;

          button.textContent =
            "Creating account...";


          let user = null;


          try {

            // ====================================
            // CREATE FIREBASE AUTH ACCOUNT
            // ====================================

            const userCredential =
              await createUserWithEmailAndPassword(
                auth,
                firebaseEmail,
                password
              );


            user =
              userCredential.user;


            // ====================================
            // SAVE PHONE AS DISPLAY NAME
            // ====================================

            await updateProfile(user, {
              displayName: normalizedPhone
            });


            // ====================================
            // SAVE USER TO FIRESTORE
            // ====================================
            //
            // IMPORTANT:
            // Collection is "users"
            // NOT "Users"
            //
            // This MUST match the Firestore Rules.
            // ====================================

            await setDoc(
              doc(db, "users", user.uid),
              {
                phone: normalizedPhone,
                balance: 0,
                createdAt: serverTimestamp()
              }
            );


            // ====================================
            // SUCCESS
            // ====================================

            document
              .getElementById("registerSection")
              .style.display = "none";

            document
              .getElementById("successScreen")
              .style.display = "block";


          } catch (error) {

            console.error(
              "Registration error:",
              error
            );


            // ====================================
            // ROLLBACK AUTH ACCOUNT
            // ====================================
            //
            // If Firebase Auth succeeded but
            // Firestore failed, delete the newly
            // created Auth account so the user
            // isn't stuck as partially registered.
            // ====================================

            if (user) {

              try {

                await deleteUser(user);

              } catch (deleteError) {

                console.error(
                  "Rollback error:",
                  deleteError
                );

              }

            }


            // ====================================
            // FIREBASE ERROR HANDLING
            // ====================================

            if (
              error.code ===
              "auth/email-already-in-use"
            ) {

              showError(
                "This phone number is already registered."
              );

            }

            else if (
              error.code ===
              "auth/weak-password"
            ) {

              showError(
                "Password must be at least 6 characters."
              );

            }

            else if (
              error.code ===
              "auth/invalid-email"
            ) {

              showError(
                "Invalid phone number."
              );

            }

            else if (
              error.code ===
              "permission-denied" ||
              error.code ===
              "firestore/permission-denied"
            ) {

              showError(
                "Account registration was blocked by Firestore permissions. Please check your Firestore Rules."
              );

            }

            else {

              showError(
                "Registration failed. Please try again."
              );

            }


            // ====================================
            // RESET BUTTON
            // ====================================

            button.disabled = false;

            button.textContent =
              "Create Account";

          }

        }
      );

  </script>

</body>
</html>
