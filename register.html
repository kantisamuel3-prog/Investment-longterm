<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Novarise - Register</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Create Account</h1>

    <form id="registerForm">

      <input
        type="tel"
        id="phone"
        placeholder="Phone Number"
        autocomplete="tel"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        type="submit"
        id="registerButton"
      >
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
      authDomain: "investpro-2dafb.firebaseapp.com",
      projectId: "investpro-2dafb",
      storageBucket: "investpro-2dafb.firebasestorage.app",
      messagingSenderId: "135092039764",
      appId: "1:135092039764:web:c4c71eef0c904346a77dc1",
      measurementId: "G-0L77SFTC4F"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // Normalize Philippine phone number
    function normalizePhone(phone) {

      phone = phone.trim();

      // Remove spaces, dashes and parentheses
      phone = phone.replace(/[\s\-()]/g, "");

      // 09171234567 -> 639171234567
      if (phone.startsWith("09")) {
        phone = "63" + phone.substring(1);
      }

      // +639171234567 -> 639171234567
      if (phone.startsWith("+63")) {
        phone = phone.substring(1);
      }

      return phone;
    }


    // Convert phone number to internal Firebase email
    function phoneToFirebaseEmail(phone) {

      const normalizedPhone = normalizePhone(phone);

      return normalizedPhone + "@novarise.local";
    }


    // Registration
    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();


        const phone =
          document.getElementById("phone").value;

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const button =
          document.getElementById("registerButton");

        const message =
          document.getElementById("message");


        // Normalize phone
        const normalizedPhone =
          normalizePhone(phone);


        // Validate Philippine phone number
        if (!/^639\d{9}$/.test(normalizedPhone)) {

          message.style.color = "red";

          message.textContent =
            "Please enter a valid Philippine phone number.";

          return;
        }


        // Check password
        if (password !== confirmPassword) {

          message.style.color = "red";

          message.textContent =
            "Passwords do not match.";

          return;
        }


        // Firebase requires an email-style identifier
        const firebaseEmail =
          phoneToFirebaseEmail(phone);


        button.disabled = true;
        button.textContent =
          "Creating account...";


        try {

          // Create Firebase Authentication account
          // using phone as the internal identifier.
          // NO SMS and NO OTP are used.
          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              firebaseEmail,
              password
            );


          const user =
            userCredential.user;


          // Save phone as display name
          await updateProfile(user, {
            displayName: normalizedPhone
          });


          // Save user information to Firestore
          await setDoc(
            doc(db, "Users", user.uid),
            {
              phone: normalizedPhone,
              balance: 0,
              createdAt: new Date()
            }
          );


          message.style.color = "green";

          message.textContent =
            "Account created successfully!";


          // Go to login page
          setTimeout(() => {

            window.location.href =
              "login.html";

          }, 1500);


        } catch (error) {

          console.error(error);

          message.style.color = "red";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            message.textContent =
              "This phone number is already registered.";

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            message.textContent =
              "Password must be at least 6 characters.";

          }

          else {

            message.textContent =
              error.message;

          }


          button.disabled = false;

          button.textContent =
            "Create Account";
        }

      });

  </script>

</body>
</html>
