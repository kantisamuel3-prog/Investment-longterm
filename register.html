<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Novarise - Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    /* =========================
       LOGO
       ========================= */

    .logo {
      text-align: center;
      margin-bottom: 5px;
    }

    .logo img {
      width: 220px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }


    /* =========================
       TITLE
       ========================= */

    h1 {
      text-align: center;
      color: #1e293b;
      font-size: 30px;
      margin-top: 10px;
      margin-bottom: 8px;
    }


    /* =========================
       SUBTITLE
       ========================= */

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }


    /* =========================
       LABEL
       ========================= */

    label {
      display: block;
      color: #334155;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .input-group {
      margin-bottom: 17px;
    }


    /* =========================
       NORMAL INPUTS
       ========================= */

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    input::placeholder {
      color: #94a3b8;
    }


    /* =========================
       PHONE INPUT
       ========================= */

    .phone-input {
      width: 100%;
      height: 52px;

      display: flex;
      align-items: center;

      border: 1px solid #cbd5e1;
      border-radius: 10px;

      background: #ffffff;

      padding: 0 14px;

      transition: 0.2s;
    }

    .phone-input:focus-within {
      border-color: #2563eb;
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    /* FIXED +63 */

    .country-code {
      color: #1e293b;
      font-size: 16px;
      font-weight: bold;

      padding-right: 12px;
      margin-right: 12px;

      border-right: 1px solid #e2e8f0;

      line-height: 25px;

      white-space: nowrap;
    }


    /* PHONE NUMBER */

    .phone-input input {
      flex: 1;

      width: 100%;
      height: 100%;

      padding: 0;

      border: none;
      border-radius: 0;

      outline: none;
      box-shadow: none;

      font-size: 16px;

      background: transparent;

      color: #1e293b;
    }

    .phone-input input:focus {
      border: none;
      box-shadow: none;
    }

    .phone-input input::placeholder {
      color: #94a3b8;
    }


    /* =========================
       REGISTER BUTTON
       ========================= */

    .register-btn {
      width: 100%;

      padding: 14px;

      margin-top: 5px;

      border: none;
      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .register-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .register-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }


    /* =========================
       MESSAGE
       ========================= */

    .message {
      display: none;

      margin-bottom: 18px;

      padding: 13px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: #fee2e2;

      color: #991b1b;

      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;

      background: #dcfce7;

      color: #166534;

      border: 1px solid #bbf7d0;
    }


    /* =========================
       SUCCESS SCREEN
       ========================= */

    .success-screen {
      display: none;
      text-align: center;
    }

    .success-icon {
      width: 75px;
      height: 75px;

      margin: 0 auto 20px;

      border-radius: 50%;

      background: #dcfce7;

      color: #16a34a;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;
      font-weight: bold;
    }

    .success-screen h2 {
      color: #166534;
      font-size: 25px;
      margin-bottom: 12px;
    }

    .success-screen p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 25px;
    }


    /* =========================
       LOGIN BUTTON
       ========================= */

    .login-btn {
      display: block;

      width: 100%;

      padding: 14px;

      background: #2563eb;

      color: white;

      text-decoration: none;

      border-radius: 10px;

      font-size: 16px;
      font-weight: bold;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }


    /* =========================
       LOGIN LINK
       ========================= */

    .login {
      text-align: center;

      margin-top: 22px;

      color: #64748b;

      font-size: 14px;
    }

    .login a {
      color: #2563eb;

      text-decoration: none;

      font-weight: bold;
    }

    .login a:hover {
      text-decoration: underline;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      .card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 26px;
      }

      .logo img {
        width: 200px;
      }

    }

  </style>
</head>


<body>

  <div class="card">


    <!-- =========================
         REGISTER SECTION
         ========================= -->

    <div id="registerSection">


      <!-- LOGO -->

      <div class="logo">

        <img
          src="novarise-logo.png.avif"
          alt="Novarise Logo"
        >

      </div>


      <!-- TITLE -->

      <h1>
        Create Account
      </h1>


      <!-- SUBTITLE -->

      <div class="subtitle">
        Create your Novarise account
      </div>


      <!-- =========================
           MESSAGE
           IMPORTANT:
           NASA ITAAS NA NG FORM
           ========================= -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- =========================
           REGISTER FORM
           ========================= -->

      <form id="registerForm">


        <!-- PHONE NUMBER -->

        <div class="input-group">

          <label for="phone">
            Phone Number
          </label>


          <div class="phone-input">


            <!-- FIXED COUNTRY CODE -->

            <span class="country-code">
              +63
            </span>


            <!-- 10 DIGIT PHONE -->

            <input
              type="tel"
              id="phone"
              placeholder="Enter your phone number"
              autocomplete="tel"
              maxlength="10"
              inputmode="numeric"
              pattern="9[0-9]{9}"
              required
            >

          </div>

        </div>


        <!-- =========================
             PASSWORD
             ========================= -->

        <div class="input-group">

          <label for="password">
            Password
          </label>


          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <!-- =========================
             CONFIRM PASSWORD
             ========================= -->

        <div class="input-group">

          <label for="confirmPassword">
            Confirm Password
          </label>


          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <!-- =========================
             REGISTER BUTTON
             ========================= -->

        <button
          type="submit"
          id="registerButton"
          class="register-btn"
        >
          Create Account
        </button>


      </form>


      <!-- LOGIN -->

      <div class="login">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>


    </div>


    <!-- =========================
         SUCCESS SCREEN
         ========================= -->

    <div
      id="successScreen"
      class="success-screen"
    >


      <div class="success-icon">
        ✓
      </div>


      <h2>
        Account Registered!
      </h2>


      <p>
        Your Novarise account has been
        created successfully.
      </p>


      <a
        href="login.html"
        class="login-btn"
      >
        Continue to Login
      </a>


    </div>


  </div>


  <!-- =========================
       FIREBASE
       ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
       ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",

      authDomain:
        "investpro-2dafb.firebaseapp.com",

      projectId:
        "investpro-2dafb",

      storageBucket:
        "investpro-2dafb.firebasestorage.app",

      messagingSenderId:
        "135092039764",

      appId:
        "1:135092039764:web:c4c71eef0c904346a77dc1",

      measurementId:
        "G-0L77SFTC4F"

    };


    /* =========================
       INITIALIZE FIREBASE
       ========================= */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* =========================
       ELEMENTS
       ========================= */

    const phoneInput =
      document.getElementById("phone");


    const passwordInput =
      document.getElementById("password");


    const confirmPasswordInput =
      document.getElementById("confirmPassword");


    const registerButton =
      document.getElementById("registerButton");


    const messageBox =
      document.getElementById("message");


    /* =========================
       NORMALIZE PHONE
       =========================

       USER ENTERS:

       9123456789

       FIREBASE USES:

       639123456789
    */

    function normalizePhone(phone) {

      // Remove anything that is not a number

      phone =
        phone.replace(/\D/g, "");


      // Only accept:
      // 9123456789

      if (
        /^9\d{9}$/.test(phone)
      ) {

        return "63" + phone;

      }


      return "";

    }


    /* =========================
       PHONE → FIREBASE EMAIL
       ========================= */

    function phoneToFirebaseEmail(phone) {

      const normalizedPhone =
        normalizePhone(phone);


      if (!normalizedPhone) {

        return "";

      }


      return normalizedPhone +
        "@novarise.local";

    }


    /* =========================
       SHOW MESSAGE
       ========================= */

    function showMessage(
      message,
      type
    ) {

      messageBox.textContent =
        message;

      messageBox.className =
        "message " + type;

    }


    /* =========================
       CLEAR MESSAGE
       ========================= */

    function clearMessage() {

      messageBox.textContent =
        "";

      messageBox.className =
        "message";

    }


    /* =========================
       PHONE INPUT
       ========================= */

    phoneInput.addEventListener(
      "input",
      function() {

        /*
          Numbers only
        */

        this.value =
          this.value.replace(
            /\D/g,
            ""
          );


        /*
          Maximum 10 digits
        */

        if (
          this.value.length > 10
        ) {

          this.value =
            this.value.substring(
              0,
              10
            );

        }


        /*
          First digit MUST be 9
        */

        if (
          this.value.length > 0 &&
          this.value.charAt(0) !== "9"
        ) {

          /*
            Remove invalid
            first character
          */

          this.value =
            this.value.substring(1);


          /*
            Show message
            ABOVE THE FORM
          */

          showMessage(
            "Phone number must start with 9.",
            "error"
          );

          return;

        }


        /*
          Clear old message
          while typing valid number
        */

        clearMessage();

      }
    );


    /* =========================
       REGISTER
       ========================= */

    document
      .getElementById("registerForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          /* =====================
             GET VALUES
             ===================== */

          const phone =
            phoneInput.value.trim();


          const password =
            passwordInput.value;


          const confirmPassword =
            confirmPasswordInput.value;


          clearMessage();


          /* =====================
             VALIDATE PHONE
             ===================== */

          if (
            !/^9\d{9}$/.test(phone)
          ) {

            showMessage(
              "Please enter a valid 10-digit Philippine mobile number starting with 9.",
              "error"
            );

            phoneInput.focus();

            return;

          }


          /* =====================
             NORMALIZE PHONE
             ===================== */

          const normalizedPhone =
            normalizePhone(phone);


          if (!normalizedPhone) {

            showMessage(
              "Invalid phone number.",
              "error"
            );

            return;

          }


          /* =====================
             PASSWORD
             ===================== */

          if (
            password.length < 6
          ) {

            showMessage(
              "Password must be at least 6 characters.",
              "error"
            );

            return;

          }


          /* =====================
             CONFIRM PASSWORD
             ===================== */

          if (
            password !==
            confirmPassword
          ) {

            showMessage(
              "Passwords do not match.",
              "error"
            );

            return;

          }


          /* =====================
             FIREBASE EMAIL
             ===================== */

          const firebaseEmail =
            phoneToFirebaseEmail(
              phone
            );


          if (!firebaseEmail) {

            showMessage(
              "Invalid phone number.",
              "error"
            );

            return;

          }


          /* =====================
             DISABLE BUTTON
             ===================== */

          registerButton.disabled =
            true;

          registerButton.textContent =
            "Creating account...";


          let user = null;


          try {


            /* ====================
               CREATE FIREBASE USER
               ==================== */

            const userCredential =
              await createUserWithEmailAndPassword(
                auth,
                firebaseEmail,
                password
              );


            user =
              userCredential.user;


            /* ====================
               SAVE PHONE
               ==================== */

            await updateProfile(
              user,
              {
                displayName:
                  normalizedPhone
              }
            );


            /* ====================
               SAVE FIRESTORE USER
               ==================== */

            await setDoc(
              doc(
                db,
                "users",
                user.uid
              ),
              {

                phone:
                  normalizedPhone,

                balance:
                  0,

                createdAt:
                  serverTimestamp()

              }
            );


            /* ====================
               SUCCESS
               ==================== */

            document
              .getElementById(
                "registerSection"
              )
              .style.display =
              "none";


            document
              .getElementById(
                "successScreen"
              )
              .style.display =
              "block";


          } catch (error) {


            console.error(
              "Registration error:",
              error
            );


            /* ====================
               ROLLBACK AUTH
               ==================== */

            if (user) {

              try {

                await deleteUser(
                  user
                );

              } catch (deleteError) {

                console.error(
                  "Rollback error:",
                  deleteError
                );

              }

            }


            /* ====================
               FIREBASE ERRORS
               ==================== */

            if (
              error.code ===
              "auth/email-already-in-use"
            ) {

              showMessage(
                "This phone number is already registered.",
                "error"
              );

            }

            else if (
              error.code ===
              "auth/weak-password"
            ) {

              showMessage(
                "Password must be at least 6 characters.",
                "error"
              );

            }

            else if (
              error.code ===
              "auth/invalid-email"
            ) {

              showMessage(
                "Invalid phone number.",
                "error"
              );

            }

            else if (
              error.code ===
              "permission-denied" ||
              error.code ===
              "firestore/permission-denied"
            ) {

              showMessage(
                "Account registration was blocked by Firestore permissions. Please check your Firestore Rules.",
                "error"
              );

            }

            else {

              showMessage(
                "Registration failed. Please try again.",
                "error"
              );

            }


            /* ====================
               ENABLE BUTTON
               ==================== */

            registerButton.disabled =
              false;

            registerButton.textContent =
              "Create Account";

          }

        }
      );

  </script>

</body>
</html>
