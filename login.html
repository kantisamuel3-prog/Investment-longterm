<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Novarise - Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f3f6fb;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: white;
  width: 90%;
  max-width: 400px;
  padding: 35px 25px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
}

.logo {
  text-align: center;
  color: #2563eb;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin-bottom: 30px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  margin-bottom: 18px;
  font-size: 16px;
}

.login-btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.login-btn:disabled {
  background: #93c5fd;
  cursor: not-allowed;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #2563eb;
  text-decoration: none;
}

.register {
  text-align: center;
  margin-top: 20px;
}

.register a {
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
}

.message {
  display: none;
  margin-bottom: 18px;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-size: 14px;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">Novarise</div>

  <div class="subtitle">
    Login to your account
  </div>

  <div id="message" class="message"></div>

  <form onsubmit="login(event)">

    <label>Phone Number</label>

    <input
      id="phone"
      type="tel"
      placeholder="09XXXXXXXXX"
      autocomplete="tel"
      required
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button
      id="loginBtn"
      class="login-btn"
      type="submit"
    >
      Login
    </button>

  </form>

  <div class="register">
    <a href="register.html">Create Account</a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0UCNZoIDYDqGk",
  authDomain: "investpro-2dafb.firebaseapp.com",
  projectId: "investpro-2dafb",
  storageBucket: "investpro-2dafb.firebasestorage.app",
  messagingSenderId: "135092039764",
  appId: "1:135092039764:web:c4c71eef0c904346a77dc1",
  measurementId: "G-0L77SFTC4F"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();


// Convert Philippine phone number
// 09171234567
// +639171234567
// 639171234567
// into a consistent format
function normalizePhone(phone) {

  phone = phone.trim();

  // Remove spaces, dashes and parentheses
  phone = phone.replace(/[\s\-()]/g, "");

  // 0917xxxxxxxx -> 63917xxxxxxxx
  if (phone.startsWith("09")) {
    phone = "63" + phone.substring(1);
  }

  // +63917xxxxxxxx -> 63917xxxxxxxx
  if (phone.startsWith("+63")) {
    phone = phone.substring(1);
  }

  return phone;
}


// Convert phone number into the
// internal Firebase email identifier
function phoneToFirebaseEmail(phone) {

  const normalized = normalizePhone(phone);

  return normalized + "@novarise.local";
}


function showMessage(message, type) {

  const box = document.getElementById("message");

  box.textContent = message;

  box.className = "message " + type;
}


function login(event) {

  event.preventDefault();

  const phone = document.getElementById("phone").value;
  const password = document.getElementById("password").value;
  const loginBtn = document.getElementById("loginBtn");

  if (!phone || !password) {
    showMessage("Please enter your phone number and password.", "error");
    return;
  }

  const normalizedPhone = normalizePhone(phone);

  // Basic Philippine number validation
  if (!/^639\d{9}$/.test(normalizedPhone)) {

    showMessage(
      "Please enter a valid Philippine phone number.",
      "error"
    );

    return;
  }

  const firebaseEmail = phoneToFirebaseEmail(phone);

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  auth.signInWithEmailAndPassword(firebaseEmail, password)

    .then(() => {

      window.location.href = "dashboard.html";

    })

    .catch((error) => {

  console.error("Firebase error code:", error.code);
  console.error("Firebase error message:", error.message);

  alert(
    "Firebase Error:\n\n" +
    error.code +
    "\n\n" +
    error.message
  );

  let message = "Login failed.";

  if (
    error.code === "auth/invalid-credential" ||
    error.code === "auth/wrong-password" ||
    error.code === "auth/user-not-found"
  ) {

    message = "Incorrect phone number or password.";

  } else if (error.code === "auth/too-many-requests") {

    message = "Too many login attempts. Please try again later.";

  }

  showMessage(message, "error");

  loginBtn.disabled = false;
  loginBtn.textContent = "Login";

});

}

</script>

</body>
</html>
