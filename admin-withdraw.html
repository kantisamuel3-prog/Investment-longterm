<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Novarise — Withdrawals</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#f4f7fb;
      color:#17345f;
      min-height:100vh;
    }

    .header{
      background:linear-gradient(135deg,#082c5c,#0b5fa8);
      color:#fff;
      padding:20px 18px;
      box-shadow:0 4px 18px rgba(0,0,0,.12);
    }

    .header-inner{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .brand-icon{
      width:42px;
      height:42px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#21c87a,#2b9cff);
      font-size:21px;
      font-weight:800;
    }

    .brand-text h1{
      font-size:21px;
      line-height:1.1;
    }

    .brand-text p{
      font-size:9px;
      letter-spacing:2px;
      opacity:.8;
      margin-top:4px;
    }

    .logout-btn{
      border:1px solid rgba(255,255,255,.35);
      background:rgba(255,255,255,.12);
      color:#fff;
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:700;
    }

    .container{
      max-width:1100px;
      margin:25px auto;
      padding:0 16px 40px;
    }

    .page-title{
      margin-bottom:18px;
    }

    .page-title h2{
      font-size:25px;
      margin-bottom:5px;
    }

    .page-title p{
      color:#718096;
      font-size:14px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-bottom:20px;
    }

    .stat{
      background:#fff;
      border:1px solid #e5ebf3;
      border-radius:16px;
      padding:18px;
      box-shadow:0 5px 18px rgba(18,52,103,.06);
    }

    .stat-label{
      font-size:12px;
      color:#718096;
      margin-bottom:8px;
    }

    .stat-value{
      font-size:25px;
      font-weight:800;
      color:#123567;
    }

    .requests{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .request-card{
      background:#fff;
      border:1px solid #e5ebf3;
      border-radius:18px;
      padding:20px;
      box-shadow:0 6px 20px rgba(18,52,103,.07);
    }

    .request-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:16px;
    }

    .member-name{
      font-size:17px;
      font-weight:800;
      color:#123567;
      word-break:break-word;
    }

    .member-email{
      color:#718096;
      font-size:12px;
      margin-top:4px;
      word-break:break-word;
    }

    .status{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }

    .status.pending{
      background:#fff5d9;
      color:#9a6800;
    }

    .status.approved{
      background:#e5f8ef;
      color:#087443;
    }

    .status.rejected{
      background:#ffe8e8;
      color:#b42318;
    }

    .amount{
      font-size:28px;
      font-weight:900;
      color:#075fae;
      margin-bottom:15px;
    }

    .details{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-bottom:17px;
    }

    .detail{
      background:#f7f9fc;
      border-radius:11px;
      padding:11px;
      min-width:0;
    }

    .detail-label{
      display:block;
      color:#8491a5;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.4px;
      margin-bottom:4px;
    }

    .detail-value{
      display:block;
      color:#263f63;
      font-size:13px;
      font-weight:700;
      word-break:break-word;
    }

    .request-date{
      color:#8a96a8;
      font-size:11px;
      margin-bottom:16px;
    }

    .actions{
      display:flex;
      gap:9px;
    }

    .action-btn{
      flex:1;
      border:0;
      border-radius:11px;
      padding:12px;
      font-weight:800;
      cursor:pointer;
      font-size:13px;
    }

    .approve-btn{
      background:#16a765;
      color:#fff;
    }

    .reject-btn{
      background:#fff;
      color:#c62828;
      border:1px solid #efb5b5;
    }

    .action-btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .empty{
      background:#fff;
      border:1px dashed #ccd6e3;
      border-radius:18px;
      padding:40px 20px;
      text-align:center;
      color:#7b8794;
    }

    .loading{
      text-align:center;
      padding:40px 20px;
      color:#718096;
    }

    .error-box{
      background:#fff0f0;
      border:1px solid #f2b8b8;
      color:#a52222;
      padding:15px;
      border-radius:13px;
      margin-bottom:18px;
      display:none;
      font-size:13px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translateX(-50%) translateY(20px);
      background:#17345f;
      color:#fff;
      padding:12px 17px;
      border-radius:12px;
      font-size:13px;
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.25s ease;
      z-index:99999;
      max-width:90%;
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:700px){
      .stats{
        grid-template-columns:1fr;
      }

      .header-inner{
        align-items:flex-start;
      }

      .details{
        grid-template-columns:1fr;
      }

      .request-top{
        flex-direction:column;
      }

      .amount{
        font-size:25px;
      }
    }

    @media(max-width:420px){
      .header{
        padding:15px 13px;
      }

      .brand-icon{
        width:38px;
        height:38px;
      }

      .brand-text h1{
        font-size:19px;
      }

      .logout-btn{
        padding:9px 11px;
        font-size:12px;
      }

      .container{
        margin-top:18px;
        padding-left:12px;
        padding-right:12px;
      }

      .request-card{
        padding:16px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">

      <div class="brand">
        <div class="brand-icon">N</div>

        <div class="brand-text">
          <h1>Novarise</h1>
          <p>BUILD INVEST GROW</p>
        </div>
      </div>

      <button class="logout-btn" id="logoutButton" type="button">
        Logout
      </button>

    </div>
  </header>

  <main class="container">

    <div class="page-title">
      <h2>Withdrawal Requests</h2>
      <p>Review and process member withdrawal requests.</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <section class="stats">

      <div class="stat">
        <div class="stat-label">PENDING REQUESTS</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">PENDING AMOUNT</div>
        <div class="stat-value" id="pendingAmount">₱0.00</div>
      </div>

      <div class="stat">
        <div class="stat-label">TOTAL REQUESTS</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>

    </section>

    <section id="requests" class="requests">
      <div class="loading">Loading withdrawal requests...</div>
    </section>

  </main>

  <div class="toast" id="toast"></div>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      runTransaction
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =========================
       FIREBASE
    ========================= */

    const firebaseConfig = {
      apiKey:
        "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
      authDomain:
        "investpro-2dafb.firebaseapp.com",
      projectId:
        "investpro-2dafb",
      storageBucket:
        "investpro-2dafb.firebasestorage.app",
      messagingSenderId:
        "135092039764",
      appId:
        "1:135092039764:web:c4c71eef0c904346a77dc1"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    const ADMIN_EMAIL = "adminwithdraw@novarise.com";


    const $ = id => document.getElementById(id);


    /* =========================
       TOAST
    ========================= */

    function toast(message){

      const el = $("toast");

      el.textContent = message;
      el.classList.add("show");

      setTimeout(() => {
        el.classList.remove("show");
      }, 2800);
    }


    /* =========================
       ERROR
    ========================= */

    function showError(message){

      const box = $("errorBox");

      box.textContent = message;
      box.style.display = "block";
    }


    /* =========================
       AUTH CHECK
    ========================= */

    onAuthStateChanged(auth, async user => {

      if(!user){

        location.href = "login.html";
        return;
      }

      if(
        !user.email ||
        user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
      ){

        showError("Access denied. This page is for the withdrawal administrator only.");

        setTimeout(() => {
          location.href = "dashboard.html";
        }, 1800);

        return;
      }

      await loadWithdrawals();
    });


    /* =========================
       LOAD WITHDRAWALS
    ========================= */

    async function loadWithdrawals(){

      const container = $("requests");

      container.innerHTML =
        `<div class="loading">Loading withdrawal requests...</div>`;

      try{

        const usersSnapshot =
          await getDocs(collection(db, "Users"));

        const requests = [];

        usersSnapshot.forEach(userDoc => {

          const data = userDoc.data() || {};

          const transactions =
            Array.isArray(data.transactions)
              ? data.transactions
              : [];

          transactions.forEach((tx, index) => {

            if(
              tx &&
              tx.type === "Withdrawal Request"
            ){

              requests.push({
                uid:userDoc.id,
                transactionIndex:index,
                user:data,
                tx
              });

            }

          });

        });


        requests.sort((a,b) => {

          const dateA =
            new Date(a.tx.date || 0).getTime();

          const dateB =
            new Date(b.tx.date || 0).getTime();

          return dateB - dateA;
        });


        renderRequests(requests);

      }catch(error){

        console.error(error);

        showError(
          "Unable to load withdrawal requests. Check your Firestore permissions."
        );

        container.innerHTML = "";
      }
    }


    /* =========================
       RENDER
    ========================= */

    function renderRequests(requests){

      const container = $("requests");

      let pendingCount = 0;
      let pendingAmount = 0;

      requests.forEach(item => {

        if(item.tx.status === "PENDING"){

          pendingCount++;

          pendingAmount +=
            Number(item.tx.amount || 0);
        }

      });


      $("pendingCount").textContent =
        pendingCount;

      $("pendingAmount").textContent =
        money(pendingAmount);

      $("totalCount").textContent =
        requests.length;


      if(!requests.length){

        container.innerHTML = `
          <div class="empty">
            <strong>No withdrawal requests</strong>
            <br>
            <span>There are currently no withdrawal requests.</span>
          </div>
        `;

        return;
      }


      container.innerHTML = "";


      requests.forEach(item => {

        const tx = item.tx;
        const user = item.user;

        const status =
          String(tx.status || "PENDING").toUpperCase();

        const card =
          document.createElement("div");

        card.className = "request-card";


        const displayName =
          user.name ||
          user.displayName ||
          tx.accountName ||
          "Novarise Member";


        const email =
          user.email ||
          "";


        const date =
          formatDate(tx.date);


        card.innerHTML = `

          <div class="request-top">

            <div>
              <div class="member-name">
                ${escapeHtml(displayName)}
              </div>

              <div class="member-email">
                ${escapeHtml(email)}
              </div>
            </div>

            <span class="status ${status.toLowerCase()}">
              ${escapeHtml(status)}
            </span>

          </div>


          <div class="amount">
            ${money(Number(tx.amount || 0))}
          </div>


          <div class="details">

            <div class="detail">
              <span class="detail-label">
                Method
              </span>

              <span class="detail-value">
                ${escapeHtml(tx.method || "—")}
              </span>
            </div>


            <div class="detail">
              <span class="detail-label">
                Account Name
              </span>

              <span class="detail-value">
                ${escapeHtml(tx.accountName || "—")}
              </span>
            </div>


            <div class="detail">
              <span class="detail-label">
                Account Number
              </span>

              <span class="detail-value">
                ${escapeHtml(tx.accountNumber || "—")}
              </span>
            </div>


            <div class="detail">
              <span class="detail-label">
                Request ID
              </span>

              <span class="detail-value">
                ${escapeHtml(tx.requestId || "—")}
              </span>
            </div>

          </div>


          <div class="request-date">
            ${escapeHtml(date)}
          </div>


          ${
            status === "PENDING"
              ? `
                <div class="actions">

                  <button
                    class="action-btn approve-btn"
                    data-action="approve"
                    data-uid="${escapeHtml(item.uid)}"
                    data-index="${item.transactionIndex}"
                  >
                    APPROVE
                  </button>

                  <button
                    class="action-btn reject-btn"
                    data-action="reject"
                    data-uid="${escapeHtml(item.uid)}"
                    data-index="${item.transactionIndex}"
                  >
                    REJECT
                  </button>

                </div>
              `
              : ""
          }

        `;


        container.appendChild(card);
      });


      container
        .querySelectorAll("[data-action]")
        .forEach(button => {

          button.addEventListener("click", () => {

            const action =
              button.dataset.action;

            const uid =
              button.dataset.uid;

            const index =
              Number(button.dataset.index);


            if(action === "approve"){

              approveWithdrawal(
                uid,
                index,
                button
              );

            }else if(action === "reject"){

              rejectWithdrawal(
                uid,
                index,
                button
              );

            }

          });

        });

    }


    /* =========================
       APPROVE
    ========================= */

    async function approveWithdrawal(
      uid,
      transactionIndex,
      button
    ){

      const confirmed =
        confirm(
          "Approve this withdrawal request?"
        );

      if(!confirmed) return;


      button.disabled = true;


      try{

        const ref =
          doc(db, "Users", uid);


        await runTransaction(
          db,
          async transaction => {

            const snap =
              await transaction.get(ref);


            if(!snap.exists()){
              throw new Error("USER_NOT_FOUND");
            }


            const data =
              snap.data();


            const transactions =
              Array.isArray(data.transactions)
                ? [...data.transactions]
                : [];


            const tx =
              transactions[transactionIndex];


            if(
              !tx ||
              tx.type !== "Withdrawal Request"
            ){
              throw new Error("REQUEST_NOT_FOUND");
            }


            if(tx.status !== "PENDING"){
              throw new Error("ALREADY_PROCESSED");
            }


            /*
             * IMPORTANT:
             * Balance is NOT deducted here.
             *
             * It was already deducted when
             * the member submitted the request.
             */

            transactions[transactionIndex] = {
              ...tx,
              status:"APPROVED",
              approvedAt:new Date().toISOString()
            };


            transaction.set(
              ref,
              { transactions },
              { merge:true }
            );

          }
        );


        toast("Withdrawal approved.");

        await loadWithdrawals();


      }catch(error){

        console.error(error);

        if(error.message === "ALREADY_PROCESSED"){

          toast(
            "This withdrawal was already processed."
          );

        }else{

          toast(
            "Unable to approve withdrawal."
          );

        }

        button.disabled = false;
      }

    }


    /* =========================
       REJECT
    ========================= */

    async function rejectWithdrawal(
      uid,
      transactionIndex,
      button
    ){

      const confirmed =
        confirm(
          "Reject this withdrawal? The amount will be refunded to the member's balance."
        );

      if(!confirmed) return;


      button.disabled = true;


      try{

        const ref =
          doc(db, "Users", uid);


        await runTransaction(
          db,
          async transaction => {

            const snap =
              await transaction.get(ref);


            if(!snap.exists()){
              throw new Error("USER_NOT_FOUND");
            }


            const data =
              snap.data();


            const transactions =
              Array.isArray(data.transactions)
                ? [...data.transactions]
                : [];


            const tx =
              transactions[transactionIndex];


            if(
              !tx ||
              tx.type !== "Withdrawal Request"
            ){
              throw new Error("REQUEST_NOT_FOUND");
            }


            if(tx.status !== "PENDING"){
              throw new Error("ALREADY_PROCESSED");
            }


            const amount =
              Number(tx.amount || 0);


            const balance =
              Number(data.balance || 0);


            /*
             * REJECT:
             * Refund the amount that was already
             * deducted when the member requested
             * the withdrawal.
             */

            transactions[transactionIndex] = {
              ...tx,
              status:"REJECTED",
              rejectedAt:new Date().toISOString()
            };


            transaction.set(
              ref,
              {
                balance:balance + amount,
                transactions
              },
              { merge:true }
            );

          }
        );


        toast(
          "Withdrawal rejected and amount refunded."
        );

        await loadWithdrawals();


      }catch(error){

        console.error(error);

        if(error.message === "ALREADY_PROCESSED"){

          toast(
            "This withdrawal was already processed."
          );

        }else{

          toast(
            "Unable to reject withdrawal."
          );

        }

        button.disabled = false;
      }

    }


    /* =========================
       HELPERS
    ========================= */

    function money(amount){

      return new Intl.NumberFormat(
        "en-PH",
        {
          style:"currency",
          currency:"PHP",
          minimumFractionDigits:2
        }
      ).format(Number(amount || 0));

    }


    function formatDate(value){

      if(!value){
        return "Date unavailable";
      }


      let date;


      if(
        typeof value === "object" &&
        value.seconds
      ){

        date =
          new Date(
            value.seconds * 1000
          );

      }else{

        date =
          new Date(value);

      }


      if(Number.isNaN(date.getTime())){
        return String(value);
      }


      return date.toLocaleString(
        "en-PH",
        {
          year:"numeric",
          month:"short",
          day:"numeric",
          hour:"numeric",
          minute:"2-digit"
        }
      );

    }


    function escapeHtml(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    /* =========================
       LOGOUT
    ========================= */

    $("logoutButton").addEventListener(
      "click",
      async () => {

        await signOut(auth);

        location.href = "login.html";

      }
    );

  </script>

</body>
</html>
