<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Novarise — Admin Withdrawals</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

.header{
  background:linear-gradient(135deg,#0b2d5c,#1456a0);
  color:white;
  padding:22px 18px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.header h1{
  font-size:22px;
  margin-bottom:5px;
}

.header p{
  font-size:13px;
  opacity:.85;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:15px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.stat-label{
  font-size:12px;
  color:#7b8798;
  margin-bottom:7px;
}

.stat-value{
  font-size:21px;
  font-weight:700;
  color:#123d72;
}

.section{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:14px;
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:#7b8798;
}

.withdrawal{
  border:1px solid #e7ebf1;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.withdrawal:last-child{
  margin-bottom:0;
}

.top-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}

.amount{
  font-size:21px;
  font-weight:700;
  color:#123d72;
}

.status{
  font-size:11px;
  font-weight:700;
  padding:6px 9px;
  border-radius:20px;
}

.status.pending{
  background:#fff4d6;
  color:#996b00;
}

.status.approved{
  background:#e7f8ee;
  color:#168047;
}

.status.rejected{
  background:#ffe8e8;
  color:#c43b3b;
}

.info{
  font-size:13px;
  line-height:1.7;
  color:#536174;
}

.info strong{
  color:#202b3b;
}

.actions{
  display:flex;
  gap:9px;
  margin-top:13px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.approve{
  background:#168047;
  color:white;
}

.reject{
  background:#c43b3b;
  color:white;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#7b8798;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#b32626;
  border:1px solid #ffd0d0;
  padding:14px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#172033;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:99999;
}

.toast.show{
  opacity:1;
}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .stat{
    padding:13px;
  }

  .stat-value{
    font-size:19px;
  }

  .top-row{
    align-items:flex-start;
  }

  .amount{
    font-size:19px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>Novarise Admin</h1>
  <p>Withdrawal Management</p>
</div>

<div class="container">

  <div class="stats">

    <div class="stat">
      <div class="stat-label">Pending Requests</div>
      <div class="stat-value" id="pendingCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Pending Amount</div>
      <div class="stat-value" id="pendingAmount">₱0.00</div>
    </div>

    <div class="stat">
      <div class="stat-label">Total Requests</div>
      <div class="stat-value" id="totalCount">0</div>
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      Withdrawal Requests
    </div>

    <div id="withdrawals">
      <div class="loading">
        Loading withdrawals...
      </div>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  runTransaction
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey:
    "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDgKqGk",

  authDomain:
    "investpro-2dafb.firebaseapp.com",

  projectId:
    "investpro-2dafb",

  storageBucket:
    "investpro-2dafb.firebasestorage.app",

  messagingSenderId:
    "135092039764",

  appId:
    "1:135092039764:web:c4c71eef0c904346a77dc1",

  measurementId:
    "G-0L77SFTC4F"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ADMIN ACCOUNT
========================= */

const ADMIN_EMAIL =
  "639999999999@novarise.local";


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function money(value){
  return "₱" + Number(value || 0).toLocaleString(
    "en-PH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(auth, async (user)=>{

  if(!user){

    $("withdrawals").innerHTML = `
      <div class="error">
        Please login first using the existing Novarise login page.
      </div>
    `;

    return;
  }


  /*
    Only the admin account can use
    this page.
  */

  if(user.email !== ADMIN_EMAIL){

    $("withdrawals").innerHTML = `
      <div class="error">
        Access denied. This page is for the withdrawal administrator only.
      </div>
    `;

    return;
  }


  /*
    Authorized admin
  */

  await loadWithdrawals();

});


/* =========================
   LOAD WITHDRAWALS
========================= */

async function loadWithdrawals(){

  $("withdrawals").innerHTML = `
    <div class="loading">
      Loading withdrawals...
    </div>
  `;

  try{

    const usersSnapshot =
      await getDocs(collection(db,"Users"));

    const requests = [];


    usersSnapshot.forEach(userDoc=>{

      const userData = userDoc.data();

      const transactions =
        Array.isArray(userData.transactions)
        ? userData.transactions
        : [];


      transactions.forEach((transaction,index)=>{

        if(
          transaction &&
          transaction.type === "Withdrawal Request"
        ){

          requests.push({

            uid:userDoc.id,

            transactionIndex:index,

            name:
              userData.name ||
              userData.displayName ||
              "Member",

            balance:
              Number(userData.balance || 0),

            ...transaction

          });

        }

      });

    });


    /*
      Newest requests first
    */

    requests.sort((a,b)=>{

      const dateA =
        new Date(a.date || 0).getTime();

      const dateB =
        new Date(b.date || 0).getTime();

      return dateB - dateA;

    });


    updateStats(requests);

    renderRequests(requests);

  }catch(error){

    console.error(error);

    $("withdrawals").innerHTML = `
      <div class="error">
        Failed to load withdrawal requests.
        Please check your Firebase connection.
      </div>
    `;

  }

}


/* =========================
   STATISTICS
========================= */

function updateStats(requests){

  const pending =
    requests.filter(
      item => item.status === "PENDING"
    );

  const pendingAmount =
    pending.reduce(
      (total,item)=>
        total + Number(item.amount || 0),
      0
    );

  $("pendingCount").textContent =
    pending.length;

  $("pendingAmount").textContent =
    money(pendingAmount);

  $("totalCount").textContent =
    requests.length;

}


/* =========================
   RENDER REQUESTS
========================= */

function renderRequests(requests){

  const container =
    $("withdrawals");


  if(!requests.length){

    container.innerHTML = `
      <div class="empty">
        No withdrawal requests yet.
      </div>
    `;

    return;
  }


  container.innerHTML =
    requests.map((item)=>{

      const status =
        item.status || "PENDING";

      const safeStatus =
        String(status).toLowerCase();


      const date =
        item.date
        ? new Date(item.date).toLocaleString(
            "en-PH",
            {
              dateStyle:"medium",
              timeStyle:"short"
            }
          )
        : "Unknown";


      const isPending =
        status === "PENDING";


      return `

        <div class="withdrawal">

          <div class="top-row">

            <div class="amount">
              ${money(item.amount)}
            </div>

            <div class="status ${safeStatus}">
              ${status}
            </div>

          </div>


          <div class="info">

            <div>
              <strong>Member:</strong>
              ${escapeHtml(item.name)}
            </div>

            <div>
              <strong>Method:</strong>
              ${escapeHtml(item.method || "—")}
            </div>

            <div>
              <strong>Account Name:</strong>
              ${escapeHtml(item.accountName || "—")}
            </div>

            <div>
              <strong>Account Number:</strong>
              ${escapeHtml(item.accountNumber || "—")}
            </div>

            <div>
              <strong>Request ID:</strong>
              ${escapeHtml(item.requestId || "—")}
            </div>

            <div>
              <strong>Date:</strong>
              ${escapeHtml(date)}
            </div>

          </div>


          ${
            isPending
            ? `

              <div class="actions">

                <button
                  class="btn approve"
                  onclick="processWithdrawal(
                    '${escapeAttr(item.uid)}',
                    '${escapeAttr(item.requestId)}',
                    'APPROVED'
                  )"
                >
                  APPROVE
                </button>

                <button
                  class="btn reject"
                  onclick="processWithdrawal(
                    '${escapeAttr(item.uid)}',
                    '${escapeAttr(item.requestId)}',
                    'REJECTED'
                  )"
                >
                  REJECT
                </button>

              </div>

            `
            : ""
          }

        </div>

      `;

    }).join("");

}


/* =========================
   APPROVE / REJECT
========================= */

window.processWithdrawal =
async function(uid,requestId,action){

  if(!auth.currentUser){
    toast("Admin login required.");
    return;
  }


  if(auth.currentUser.email !== ADMIN_EMAIL){
    toast("Access denied.");
    return;
  }


  const message =
    action === "APPROVED"
    ? "Approve this withdrawal?"
    : "Reject this withdrawal and refund the member?";


  if(!confirm(message)){
    return;
  }


  try{

    const userRef =
      doc(db,"Users",uid);


    await runTransaction(
      db,
      async(transaction)=>{

        const snap =
          await transaction.get(userRef);


        if(!snap.exists()){
          throw new Error("USER_NOT_FOUND");
        }


        const data =
          snap.data();


        const transactions =
          Array.isArray(data.transactions)
          ? [...data.transactions]
          : [];


        const index =
          transactions.findIndex(
            item =>
              item &&
              item.type === "Withdrawal Request" &&
              item.requestId === requestId
          );


        if(index === -1){
          throw new Error("REQUEST_NOT_FOUND");
        }


        const request =
          transactions[index];


        /*
          Prevent processing twice.
        */

        if(request.status !== "PENDING"){

          throw new Error("ALREADY_PROCESSED");

        }


        if(action === "APPROVED"){

          /*
            Balance was already deducted
            when the member submitted
            the withdrawal.

            Therefore:
            DO NOT deduct again.
          */

          transactions[index] = {

            ...request,

            status:"APPROVED",

            approvedAt:
              new Date().toISOString()

          };


          transaction.update(
            userRef,
            {
              transactions
            }
          );

        }


        if(action === "REJECTED"){

          const currentBalance =
            Number(data.balance || 0);


          /*
            Refund the original amount.
          */

          const newBalance =
            currentBalance +
            Number(request.amount || 0);


          transactions[index] = {

            ...request,

            status:"REJECTED",

            rejectedAt:
              new Date().toISOString()

          };


          transaction.update(
            userRef,
            {

              balance:newBalance,

              transactions

            }
          );

        }

      }
    );


    toast(
      action === "APPROVED"
      ? "Withdrawal approved."
      : "Withdrawal rejected and refunded."
    );


    await loadWithdrawals();


  }catch(error){

    console.error(error);


    if(error.message === "ALREADY_PROCESSED"){

      toast(
        "This withdrawal has already been processed."
      );

    }else if(error.message === "REQUEST_NOT_FOUND"){

      toast(
        "Withdrawal request was not found."
      );

    }else if(error.message === "USER_NOT_FOUND"){

      toast(
        "Member account was not found."
      );

    }else{

      toast(
        "Something went wrong. Please try again."
      );

    }

  }

};


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}

</script>

</body>
</html>
